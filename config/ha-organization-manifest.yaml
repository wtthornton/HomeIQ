design_notes: 'Label taxonomy: three managed prefixes carried forward from the existing scheme already
  present on the living_room/kitchen/office WLED devices and the office presence sensors — role: (functional
  role, e.g. role:primary-light, role:presence), class: (entity class, e.g. class:wled-config, class:diagnostic),
  area: (soft area tag mirroring the device''s area_id, used because these entities are virtual per-device
  children rather than physically placed themselves). No new prefixes invented. Because these three prefixes
  are now declared as managed (fully reconciled by recipes), every entity currently carrying a role:/class:/area:
  label had to be re-listed in entity_labels — an omission would read as a removal — hence the large ''preserve
  pre-existing labeling'' block for living_room, kitchen, and office WLED entities and the office presence
  sensors. The Bar and Dishes WLED devices had zero labels despite matching every other WLED device 1:1
  in entity shape; extended the identical taxonomy to their entities using device name/model evidence
  (area:bar, area:dining_room) for consistency.


  Coverage: 32 devices total. device_areas: 13 devices with area assignment (7 already correctly placed
  and reaffirmed: kitchen Frame, guest room TV, family room TV, Dishes WLED/dining_room retained as-is,
  living_room/kitchen/office/bar WLED; 6 newly assigned from clear name evidence — two duplicate-integration
  entries for the kitchen Frame TV, one duplicate for the guest room TV, and two Samsung TV integration
  duplicates mapped to office from ''[TV] Office Samsung TV'' / ''Office Samsung TV (UN65TU700DFXZA)'').
  not_applicable: 18 devices — 12 HA integration/service entries (entry_type ''service'': Sun, Core, Supervisor,
  Host, OS, Backup, Google Translate, Met.no Forecast, File editor, Terminal & SSH, Matter Server, Get
  HACS) and 6 physical infrastructure devices (Bluetooth radio, 2x Raspberry Pi host boards, Zigbee radio
  stick, Zigbee coordinator, network router) — none are placeable room devices. blocked_on_human: 1 device
  (HP Tango printer) — ''HP Tango'' names a product line, not a room, and no other evidence (model/manufacturer)
  indicates placement, so per the owner''s 2026-08-12 rule this is a genuine unknown rather than a lazy
  punt. Total 13 + 18 + 1 = 32, matching device count exactly.


  Helper prerequisites: none needed. The two office presence proxy input_booleans already exist in the
  inventory''s helpers list and are only being re-labeled (role:presence, area:office) to preserve their
  existing labeling under the now-managed role:/area: prefixes — no new helper creation required.


  Explicitly not touched: entity_id values (zero renames proposed), and any alias proposals — none of
  the entity names contain ambiguity that aliases would resolve, so entity_aliases is empty.'
