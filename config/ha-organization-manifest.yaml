  scene_policy:
  - platform: hue
    stance: bridge_owned
    reason: All 190 scenes imported by the Hue Bridge Pro pairing live on the bridge; HA's hue integration imports
      them read-only. The manifest neither regenerates nor drift-flags them — the bridge (edited via the Hue app)
      is their source of truth. Any future scene from another platform trips the scene-policy recipe's blocked_on_human
      until it gets its own stance row (TAP-5975).
design_notes: 'Label taxonomy restricted to the three managed prefixes already in use (role:, class:, area:) per
  owner instruction — no new prefixes minted. role:primary-light marks each WLED controller''s main light entity;
  class:wled-config / class:diagnostic separate WLED tuning entities from telemetry/diagnostic ones; area:* mirrors
  device-level area assignment onto entities for filtering. role:presence tags the office presence proxy helpers
  and binary sensors that feed presence automations. All of these labels already existed on the listed entities
  in the inventory; they are re-declared in full (not just diffed) because the label sets are fully reconciled by
  recipes — an entity''s omission from entity_labels would read as "remove all its managed labels," which is not
  intended here. No new labels or prefixes were added since there was no fresh evidence to justify them.


  Coverage (corrected caller-side after the TV group-device disposition; the authored text undercounted not_applicable
  by one): 47 physical devices assigned to areas (all Hue lights/sensors/buttons, WLED controllers, TVs, Inovelli
  switches, Aqara sensor); 40 devices marked not_applicable (plus 2 blocked_on_human = 89 total) (all Home Assistant
  service/integration devices, host hardware — Pi, Bluetooth radio, Zigbee coordinator/stick, router, Hue Bridge
  — and all Hue-imported virtual Room/Zone/Service-Group devices, including the ''tv'' room artifact per owner note);
  2 devices blocked_on_human (unk_manufacturer/unk_model sensor with zero naming evidence, and the HP Tango printer
  per explicit owner note). Device f40d284b9f1d2ba87dfd6594299968eb (''Living Room Left Play'') was moved out of
  the fake ''tv'' area into living_room per owner instruction; device 4e917d72... (Aqara occupancy sensor, area_id
  null in registry) was assigned to office per the owner''s explicit note retaining the prior office Aqara sensor
  placement — this is the one case where I placed a device despite a null area_id, justified by direct owner instruction
  rather than inference.


  No new areas needed — ''tv'' is explicitly not real and excluded; ''bedroom'' is being retired and untouched,
  matching owner instruction. No new helpers required; the two office presence proxy input_booleans already exist
  and are only re-labeled, not recreated. No entity_id renames or aliases proposed — no strong alias evidence in
  the inventory (aliases arrays are all empty and no naming ambiguity strong enough to justify one).'
