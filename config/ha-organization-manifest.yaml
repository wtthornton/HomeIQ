design_notes: 'Label taxonomy: three managed prefixes. role: marks functional purpose (role:primary-light
  for the WLED device''s main light entity, matching existing role:primary-light and role:presence usage).
  class: marks entity category within a device (class:wled-config for control/config entities, class:diagnostic
  for read-only telemetry/status entities) — mirrors the existing class:wled-config / class:diagnostic
  split already present on the Office WLED device''s entities. area: mirrors the device''s assigned area
  onto its entities, matching the existing area:office pattern used across Office''s entities and the
  office presence helpers/automation. I only added labels/areas for the two newly-assigned WLED devices
  (Living Room, Kitchen Strip); Office''s entities already carry correct labels and were left untouched
  (additive-only, no need to restate). Kitchen''s two extra light entities (light.kitchen_strip_main,
  light.kitchen_strip_segment_1) were kept off role:primary-light to avoid two "primary" lights on one
  device — light.kitchen_strip (the bare/base entity) is the primary handle, consistent with light.office
  and light.living_room naming.


  Coverage split (20 physical/service devices total): 3 assigned to device_areas (Living Room WLED → living_room,
  Kitchen Strip WLED → kitchen, Office WLED → office [restated, already correct]); 7 not_applicable/not_applicable
  (Sun, HA Core, HA Supervisor, HA Host, HA OS, Backup, Google Translate, Met.no Forecast — all entry_type=service);
  10 not_applicable/blocked_on_human (Bluetooth adapter, "50\" The Frame" TV, Guest Room TV, Family Room
  TV, Dishes WLED, Bar WLED, Raspberry Pi, Raspberry Pi 5, CC2652 radio) — each lacks a name/model that
  maps to an existing area slug (Guest Room and Family Room aren''t in the areas list; Dishes/Bar name
  objects, not rooms; the three compute/radio devices carry no location hint at all).


  No new helpers needed — the two office presence proxy input_booleans already exist and are correctly
  labeled/aliased in the inventory; nothing in this manifest references a helper that doesn''t already
  exist. No entity_aliases proposed: none of the untouched entities had ambiguous or missing voice-friendly
  names that warranted an addition, and I avoided inventing aliases without a clear naming signal. Zero
  entity_id changes proposed, consistent with the additive-only / no-rename constraint.'
