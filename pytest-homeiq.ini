[pytest]
; tests/automations runs a real Home Assistant core in-process against synthetic
; state. It shares this config because it needs the same .venv-ha environment:
; pytest-homeassistant-custom-component pins the exact HA release the live
; instance runs, so a behavioural result here is a result for production.
testpaths = tests/custom_components/homeiq tests/automations
asyncio_mode = auto
python_files = test_*.py
addopts = --import-mode=importlib
