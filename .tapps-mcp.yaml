cursor_stop_completion_gate: warn
linear_team: TappsCodingAgents
linear_project: HomeIQ
mcp_bundle: full
# ADR-0024: use the shared localhost HTTP fleet (127.0.0.1:8760-8765) rather than
# spawning six stdio servers per session. Matches WebStoreDNA and AgentForge.
mcp_transport: http

# Skill inventory intentionally exceeds the stock ceiling of 20: 24 tapps-managed
# skills + 6 docs skills + 11 third-party AgentForge skills, all deliberately kept
# (skill_tier: full). Raised rather than pruned per tapps_doctor guidance.
doctor_context_budget:
  skill_count_max: 45

# upgrade_skip_files takes per-artifact TOKENS, not file paths. The valid set is
# fixed (AGENTS.md, CLAUDE.md, TECH_STACK.md, .claude/settings.json,
# .claude/hooks, .claude/agents, .claude/skills, .claude/rules/<name>.md,
# .mcp.json, karpathy). Anything else is silently ignored and shows up only as
# `unknown_skip_tokens` in the tapps_upgrade result payload.
#
# This list previously held four full FILE paths, none of which are valid
# tokens, so none of them ever protected anything. Two upgrades quietly
# rewrote the orchestration-prompt skill as a result: e94c6efe (3.12.68) and
# cda2f904 (3.12.72), the latter taking SKILL.md 408 -> 363 lines. The fix on
# 2026-08-23 was to fold that hardening upstream into the tapps-mcp template,
# so an upgrade now DELIVERS it instead of removing it — which is why nothing
# needs skipping here any more.
#
# If you ever do need to freeze a skill, the only lever is the whole-directory
# token `.claude/skills`, which also freezes every other skill. Prefer folding
# the change upstream. `.github/workflows/dependabot-auto-merge.yml` was also
# listed; upgrade never writes that path, so the entry was inert.
upgrade_skip_files: []
