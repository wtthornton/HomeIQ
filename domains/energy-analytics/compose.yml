name: homeiq-energy-analytics
# domains/energy-analytics/compose.yml — Proactive energy recommendations
#
# TAP-7275: `proactive-agent-service` folded into
# `domains/automation-core/automation-domain`. Its routes (/api/v1/suggestions,
# /api/v1/tasks, /api/proactive) are served unchanged by that process on port
# 8030, and its Postgres schema is still `energy` — the merged process reads it
# from ENERGY_DB_SCHEMA so the three folded slices cannot collide on one
# DATABASE_SCHEMA.
#
# This file is kept rather than deleted: the domain still exists in the
# repository layout (README, compose.env.example, CI group), and a compose file
# with no services is an honest statement that the domain currently ships no
# container of its own. `scripts/check-container-budget.py` parses it with a
# YAML loader and counts zero production services here.

services: {}

networks:
  homeiq-network:
    external: true
