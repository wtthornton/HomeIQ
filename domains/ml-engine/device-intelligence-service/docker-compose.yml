services:
  device-intelligence-service:
    build: .
    ports:
      - "8028:8019"
    env_file:
      # Repo root .env (three levels up from this service directory)
      - path: ../../../.env
        required: false
    environment:
      - DEVICE_INTELLIGENCE_PORT=8019
      - DEVICE_INTELLIGENCE_HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - HA_URL=${HA_HTTP_URL:-${HOME_ASSISTANT_URL:-}}
      - MQTT_BROKER=${MQTT_BROKER:-}
      - ZIGBEE2MQTT_BASE_TOPIC=zigbee2mqtt
      - MODELS_DIR=/app/models
    volumes:
      - ./data:/app/data
      # Models persist across restarts (TAP-6242)
      - ./models:/app/models
    networks:
      - homeiq_homeiq-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8019/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  homeiq_homeiq-network:
    external: true
