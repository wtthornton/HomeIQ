name: homeiq-device-management
# domains/device-management/compose.yml — Device lifecycle, health, onboarding, and activity

services:
  device-health-monitor:
    build:
      context: ../..
      dockerfile: domains/device-management/device-health-monitor/Dockerfile
    container_name: homeiq-device-health-monitor
    restart: unless-stopped
    ports:
      - "8019:8019"
    env_file:
      - ../../.env
    environment:
      - DEVICE_HEALTH_MONITOR_PORT=${DEVICE_HEALTH_MONITOR_PORT:-8019}
      - HA_URL=${HA_HTTP_URL:-${HOME_ASSISTANT_URL:-http://homeassistant:8123}}
      - HA_TOKEN=${HA_TOKEN:-${HOME_ASSISTANT_TOKEN:-}}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RELOAD=${RELOAD:-false}
    networks:
      - homeiq-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8019/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=device-health-monitor,group=device-management,environment=production"

  device-context-classifier:
    build:
      context: ../..
      dockerfile: domains/device-management/device-context-classifier/Dockerfile
    container_name: homeiq-device-context-classifier
    restart: unless-stopped
    ports:
      - "8032:8020"
    env_file:
      - ../../.env
    environment:
      - DEVICE_CONTEXT_CLASSIFIER_PORT=${DEVICE_CONTEXT_CLASSIFIER_PORT:-8020}
      - HA_URL=${HA_HTTP_URL:-${HOME_ASSISTANT_URL:-http://homeassistant:8123}}
      - HA_TOKEN=${HA_TOKEN:-${HOME_ASSISTANT_TOKEN:-}}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RELOAD=${RELOAD:-false}
    networks:
      - homeiq-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=device-context-classifier,group=device-management,environment=production"

  device-setup-assistant:
    build:
      context: ../..
      dockerfile: domains/device-management/device-setup-assistant/Dockerfile
    container_name: homeiq-device-setup-assistant
    restart: unless-stopped
    ports:
      - "8021:8021"
    env_file:
      - ../../.env
    environment:
      - DEVICE_SETUP_ASSISTANT_PORT=${DEVICE_SETUP_ASSISTANT_PORT:-8021}
      - HA_URL=${HA_HTTP_URL:-${HOME_ASSISTANT_URL:-http://homeassistant:8123}}
      - HA_TOKEN=${HA_TOKEN:-${HOME_ASSISTANT_TOKEN:-}}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RELOAD=${RELOAD:-false}
    networks:
      - homeiq-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8021/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=device-setup-assistant,group=device-management,environment=production"

  device-database-client:
    build:
      context: ../..
      dockerfile: domains/device-management/device-database-client/Dockerfile
    container_name: homeiq-device-database-client
    restart: unless-stopped
    ports:
      - "8022:8022"
    env_file:
      - ../../.env
    environment:
      - DEVICE_DATABASE_CLIENT_PORT=${DEVICE_DATABASE_CLIENT_PORT:-8022}
      - DEVICE_DATABASE_API_URL=${DEVICE_DATABASE_API_URL:-}
      - DEVICE_DATABASE_API_KEY=${DEVICE_DATABASE_API_KEY:-}
      - DEVICE_CACHE_DIR=${DEVICE_CACHE_DIR:-data/device_cache}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RELOAD=${RELOAD:-false}
    volumes:
      - device_cache_data:/app/data/device_cache
    networks:
      - homeiq-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8022/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=device-database-client,group=device-management,environment=production"

  device-recommender:
    build:
      context: ../..
      dockerfile: domains/device-management/device-recommender/Dockerfile
    container_name: homeiq-device-recommender
    restart: unless-stopped
    ports:
      - "8023:8023"
    env_file:
      - ../../.env
    environment:
      - DEVICE_RECOMMENDER_PORT=${DEVICE_RECOMMENDER_PORT:-8023}
      - HA_URL=${HA_HTTP_URL:-${HOME_ASSISTANT_URL:-http://homeassistant:8123}}
      - HA_TOKEN=${HA_TOKEN:-${HOME_ASSISTANT_TOKEN:-}}
      - DEVICE_DATABASE_API_URL=${DEVICE_DATABASE_API_URL:-}
      - DEVICE_DATABASE_API_KEY=${DEVICE_DATABASE_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RELOAD=${RELOAD:-false}
    networks:
      - homeiq-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8023/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=device-recommender,group=device-management,environment=production"

  ha-setup-service:
    build:
      context: ../..
      dockerfile: domains/device-management/ha-setup-service/Dockerfile
    container_name: homeiq-setup-service
    # The wizard answers endpoint (TAP-5945) writes owner decisions into the
    # repo's committed manifest; the bind mount overlays the image's baked
    # copy so those writes are durable and git-visible (commit them like any
    # change). Wizard-induced dirty files in git status are expected.
    restart: unless-stopped
    ports:
      - "8024:8020"
    env_file:
      - ../../.env
      # Optional legacy token file — absent on fresh clones
      - path: ../../infrastructure/.env.websocket
        required: false
    environment:
      - SERVICE_NAME=ha-setup-service
      - SERVICE_PORT=8020
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - HA_URL=${HA_HTTP_URL:-${HOME_ASSISTANT_URL:-}}
      - HA_TOKEN=${HA_TOKEN:-${HOME_ASSISTANT_TOKEN:-}}
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER:-homeiq}:${POSTGRES_PASSWORD:?required}@postgres:5432/homeiq
      - DATABASE_SCHEMA=devices
      - DATA_API_URL=http://data-api:8006
      - API_KEY=${API_KEY:-}
      - ADMIN_API_URL=http://admin-api:8004
      - HEALTH_CHECK_INTERVAL=60
      - INTEGRATION_CHECK_INTERVAL=300
      - ENABLE_PERFORMANCE_MONITORING=true
      - PERFORMANCE_SAMPLE_INTERVAL=30
      # Overrides the .env value, which names a path on the HOST. Inside the
      # container the key is only ever at the mount target below.
      - HOMEIQ_HA_SSH_KEY=/run/secrets/ha_agent_key
      # Network observer for integrations.unclaimed_devices. Points at
      # zeek-network-service, which owns LAN observation (this container is on
      # a docker bridge and cannot see LAN layer 2). Unset => the recipe
      # reports NOT_APPLICABLE rather than implying the network is clean.
      - HOMEIQ_NETWORK_OBSERVER_URL=${HOMEIQ_NETWORK_OBSERVER_URL:-http://zeek-network-service:8048}
    volumes:
      - ha_setup_data:/app/data
      - ../../config:/app/config
      - homeiq_logs:/var/log/homeiq
      # Private key for the init agent's write path to the HA host's /config
      # (the core_ssh add-on). Read-only, and a SEPARATE copy of the operator's
      # key rather than the key itself: a bind mount keeps host ownership, so
      # the file must be group-readable for uid 1001 to open it at all, and
      # loosening the original would make ssh on the host reject it. The copy
      # is 0640 root-group-1000; SSHHostFiles restages it 0600 before invoking
      # ssh, because OpenSSH refuses a group-readable private key.
      #
      # NOTE: this grants the container root SSH to Home Assistant. Point
      # HOMEIQ_HA_SSH_KEY_HOST at your own copy, or drop this mount and the
      # env override above to disable the write path entirely (recipes needing
      # it then report NOT_APPLICABLE rather than failing).
      - ${HOMEIQ_HA_SSH_KEY_HOST:-/home/wtthornton/.homeiq-secrets/ha_agent_key}:/run/secrets/ha_agent_key:ro
    # appuser is uid 1001; the repo's config/ files are 1000:1000 mode 664.
    # Joining group 1000 makes the bind-mounted manifest writable without
    # changing the user (which would break ha_setup_data ownership).
    # Files the CONTAINER creates there (e.g. init-triage.json) are
    # 1001:1001 mode 664 — group-writable by the code's own chmod, but the
    # host user edits them via the API or sudo, not in place.
    group_add:
      - "1000"
    # Cross-domain: depends on core-platform/data-api, core-platform/admin-api
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '1.0'
        reservations:
          memory: 192M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=ha-setup-service,group=device-management,environment=production"

volumes:
  ha_setup_data:
  device_cache_data:
  homeiq_logs:
    external: true
    name: ${HOMEIQ_LOGS_VOLUME:-homeiq-core-platform_homeiq_logs}

networks:
  homeiq-network:
    external: true
