name: homeiq-data-collectors
# domains/data-collectors/compose.yml — Group 2: data-collectors
# Stateless data fetchers. Each polls an external API and writes to InfluxDB.
# Deploy cadence: Medium — per-API contract change
#
# Services: collectors (weather+sports+air-quality+electricity-pricing+
#           calendar+smart-meter folded into one process, TAP-7274),
#           log-aggregator, zeek, zeek-network-service
# Depends on: Group 1 (influxdb write, data-api metadata)
# Depended on by: Groups 3, 4 (indirect — via InfluxDB data)

services:
  collectors:
    # One process for the six former pure-HTTP collectors — weather-api,
    # sports-api, air-quality, electricity-pricing, calendar, smart-meter —
    # folded per docs/architecture/collapse-map.md section C1. No `profiles`
    # key: it is production, same as the services it replaces.
    build:
      context: ../..
      dockerfile: domains/data-collectors/collectors-service/Dockerfile
    container_name: homeiq-collectors
    restart: unless-stopped
    ports:
      - "8009:8009"
    env_file:
      - ../../.env
    environment:
      - SERVICE_PORT=8009
      # --- weather (Open-Meteo needs no API key; queried by coordinate) ---
      - WEATHER_LOCATION=${WEATHER_LOCATION:-Las Vegas}
      - WEATHER_LATITUDE=${LATITUDE:-35.9561663}
      - WEATHER_LONGITUDE=${LONGITUDE:--115.1833246}
      - CACHE_TTL_SECONDS=900
      # --- sports ---
      - SPORTS_POLL_INTERVAL=${SPORTS_POLL_INTERVAL:-60}
      # --- air-quality (Open-Meteo air-quality also needs no API key) ---
      - AIR_QUALITY_LATITUDE=${LATITUDE:-36.1699}
      - AIR_QUALITY_LONGITUDE=${LONGITUDE:--115.1398}
      # --- electricity-pricing ---
      - PRICING_PROVIDER=${PRICING_PROVIDER:-awattar}
      - PRICING_API_KEY=${PRICING_API_KEY:-}
      # --- calendar ---
      - CALENDAR_ENTITIES=${CALENDAR_ENTITIES:-}
      - CALENDAR_FETCH_INTERVAL=${CALENDAR_FETCH_INTERVAL:-900}
      # --- smart-meter ---
      - METER_TYPE=${METER_TYPE:-home_assistant}
      - METER_API_TOKEN=${METER_API_TOKEN:-}
      - METER_DEVICE_ID=${METER_DEVICE_ID:-}
      - FETCH_INTERVAL_SECONDS=300
      # --- shared Home Assistant connection (unprefixed across all six) ---
      - HA_HTTP_URL=${HA_HTTP_URL:-}
      - HA_WS_URL=${HA_WS_URL:-}
      - HA_TOKEN=${HA_TOKEN:-${HOME_ASSISTANT_TOKEN:-}}
      - NABU_CASA_URL=${NABU_CASA_URL:-}
      - NABU_CASA_TOKEN=${NABU_CASA_TOKEN:-}
      - HOME_ASSISTANT_URL=${HOME_ASSISTANT_URL:-}
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN:-}
      # --- shared InfluxDB (every adapter writes here; calendar keeps its
      #     own "events" bucket internally via CALENDAR_INFLUXDB_BUCKET) ---
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?required}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-homeiq}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-home_assistant_events}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # Cross-group depends_on removed (influxdb is in core-platform)
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 384M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=collectors,group=data-collectors,environment=production"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  log-aggregator:
    build:
      context: ../..
      dockerfile: domains/data-collectors/log-aggregator/Dockerfile
    container_name: homeiq-log-aggregator
    restart: unless-stopped
    ports:
      - "8015:8015"
    env_file:
      - ../../.env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-/app/logs}
      - LOG_FORMAT=json
      - PORT=8015
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../logs:/app/logs
      - homeiq_logs:/var/log/homeiq
    group_add:
      - "0"
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=log-aggregator,group=data-collectors,environment=production"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8015/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Zeek network monitor — packet capture (Story 72.1, 72.2)
  zeek:
    image: homeiq/zeek:latest
    build:
      context: ../..
      dockerfile: domains/data-collectors/zeek-network-service/Dockerfile.zeek
    container_name: homeiq-zeek
    network_mode: host  # Required for physical NIC access
    cap_add:
      - NET_RAW           # Required for packet capture
      - NET_ADMIN         # Required for interface configuration
    volumes:
      - zeek-logs:/zeek/logs
    environment:
      - ZEEK_INTERFACE=${ZEEK_INTERFACE:-eth0}
      - ZEEK_BPF_FILTER=not net 172.18.0.0/16  # Exclude homeiq-network bridge
      - ZEEK_TELEMETRY_PORT=9911
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 2048M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=zeek,group=data-collectors,environment=production"

  # Zeek network service — log parser and data router (Story 72.2, 72.3)
  zeek-network-service:
    build:
      context: ../..
      dockerfile: domains/data-collectors/zeek-network-service/Dockerfile
    container_name: homeiq-zeek-network-service
    restart: unless-stopped
    ports:
      - "8048:8048"
    volumes:
      - zeek-logs:/zeek/logs:ro  # Read-only access to Zeek logs
      - zeek-state:/app/state    # Persistent seek offset state
    env_file:
      - ../../.env
    environment:
      - SERVICE_NAME=zeek-network-service
      - SERVICE_PORT=8048
      - INFLUXDB_URL=${INFLUXDB_URL:-http://influxdb:8086}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?required}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-homeiq}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-home_assistant_events}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SCHEMA=devices
      - DATA_API_URL=${DATA_API_URL:-http://data-api:8006}
      - DATA_API_KEY=${DATA_API_KEY}
      - ZEEK_LOG_DIR=/zeek/logs
      - POLL_INTERVAL_SECONDS=30
      - DEVICE_METRICS_INTERVAL_SECONDS=60
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      zeek:
        condition: service_healthy
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 192M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=zeek-network-service,group=data-collectors,environment=production"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8048/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Shared volumes — homeiq_logs owned by core-platform
volumes:
  homeiq_logs:
    external: true
    name: ${HOMEIQ_LOGS_VOLUME:-homeiq-core-platform_homeiq_logs}
  zeek-logs:
    driver: local
  zeek-state:
    driver: local

networks:
  homeiq-network:
    external: true
