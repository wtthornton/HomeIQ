[pytest]
# Pytest Configuration for collectors-service

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

minversion = 7.0

# Add current directory and repo root to Python path
pythonpath = . ../../..

addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-report=xml:coverage.xml
    --strict-config

markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require external services)
    slow: Slow tests (>1 second)
    asyncio: Async tests
    requires_influxdb: Tests that require InfluxDB
    requires_api: Tests that require external upstream APIs

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = tests

norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    coverage_html

[coverage:run]
source = src
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    */conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
fail_under = 70
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
