[pytest]
# automation-domain test configuration (TAP-7275).
#
# testpaths covers all three slices' re-homed suites in one run; each slice
# keeps its own subdirectory under tests/ so a failure names the slice.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests
    integration: Integration tests (real Docker/HA)
    e2e: End-to-end tests
    performance: Performance tests
    latency: Latency tests
    requires_db: Tests that require a database connection

asyncio_mode = auto
