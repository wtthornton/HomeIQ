name: homeiq-automation-core
# domains/automation-core/compose.yml — Core automation generation, validation, and deployment
# Deploy cadence: High — most active feature development
#
# Services: automation-domain, yaml-validation-service,
#           automation-linter, automation-trace-service, ha-device-control
# Depends on: core-platform (data-api), ml-engine (model-server)
# Depended on by: frontends (display automation results), blueprints

services:
  automation-domain:
    # TAP-7275: ha-ai-agent-service (8030), ai-automation-service-new (8025) and
    # energy-analytics/proactive-agent-service (8031) folded into one process.
    # Every route keeps its path; only the hostname and port changed.
    build:
      context: ../..
      dockerfile: domains/automation-core/automation-domain/Dockerfile
    container_name: homeiq-automation-domain
    restart: unless-stopped
    ports:
      - "8030:8030"
    env_file:
      - ../../.env
    environment:
      - HA_URL=${HA_HTTP_URL:-http://homeassistant:8123}
      - HA_TOKEN=${HA_TOKEN:-}
      - DATA_API_URL=http://data-api:8006
      - DATA_API_KEY=${API_KEY:-}
      - DATA_API_API_KEY=${API_KEY:-}
      - DEVICE_INTELLIGENCE_URL=http://device-intelligence-service:8019
      - DEVICE_INTELLIGENCE_API_KEY=${API_KEY:-}
      - PATTERN_SERVICE_URL=http://ai-pattern-service:8020
      - YAML_VALIDATION_SERVICE_URL=http://yaml-validation-service:8037
      - WEATHER_API_URL=http://collectors:8009
      - AI_AUTOMATION_API_KEY=${API_KEY:-}
      - API_KEY=${API_KEY:-}
      - HA_AGENT_API_KEY=${API_KEY:-}
      - DATA_COLLECTORS_API_KEY=${API_KEY:-}
      # AgentForge: every LLM call this process makes is a workflow run there.
      # No provider API key, no provider SDK and no model name in this block.
      - AGENTFORGE_URL=${AGENTFORGE_URL:-http://localhost:8010}
      - AGENTFORGE_API_KEY=${AGENTFORGE_API_KEY:-}
      - AGENTFORGE_PROJECT_SLUG=${AGENTFORGE_PROJECT_SLUG:-homeiq}
      - AGENTFORGE_TIMEOUT=${AGENTFORGE_TIMEOUT:-180}
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER:-homeiq}:${POSTGRES_PASSWORD:?required}@postgres:5432/homeiq
      # One schema per slice. A single DATABASE_SCHEMA would bind all three to
      # whichever value was set last, and the two that lost would read and write
      # the wrong schema without erroring.
      - AGENT_DB_SCHEMA=${AGENT_DB_SCHEMA:-agent}
      - AUTOMATION_DB_SCHEMA=${AUTOMATION_DB_SCHEMA:-automation}
      - ENERGY_DB_SCHEMA=${ENERGY_DB_SCHEMA:-energy}
      - SERVICE_PORT=8030
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-true}
      - SCHEDULER_TIME=${SCHEDULER_TIME:-03:00}
    depends_on:
      yaml-validation-service:
        condition: service_healthy
      # Cross-group depends_on removed (data-api in core, device-intelligence in ml-engine)
    networks:
      - homeiq-network
    volumes:
      - automation_domain_data:/app/data
      - ai_automation_data:/app/authoring-data
    deploy:
      resources:
        limits:
          # 256M each for three containers becomes 512M for one process: the
          # three interpreters, engine pools and FastAPI apps collapse into one,
          # but the merged process still holds all three slices' models and
          # schedulers.
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=automation-domain,group=automation-core,environment=production"

  yaml-validation-service:
    build:
      context: ../..
      dockerfile: domains/automation-core/yaml-validation-service/Dockerfile
    container_name: homeiq-yaml-validation-service
    restart: unless-stopped
    ports:
      - "8037:8037"
    env_file:
      - ../../.env
    environment:
      - DATA_API_URL=http://data-api:8006
      - DATA_API_KEY=${API_KEY:-}
      - HA_URL=${HA_HTTP_URL:-${HOME_ASSISTANT_URL:-}}
      - HA_TOKEN=${HOME_ASSISTANT_TOKEN:-}
      - SERVICE_PORT=8037
      - VALIDATION_LEVEL=moderate
      - ENABLE_NORMALIZATION=true
      - ENABLE_ENTITY_VALIDATION=true
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # Cross-group depends_on removed (data-api in core)
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8037/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=yaml-validation-service,group=automation-core,environment=production"

  automation-linter:
    build:
      context: ../..
      dockerfile: domains/automation-core/automation-linter/Dockerfile
    container_name: homeiq-automation-linter
    restart: unless-stopped
    ports:
      - "8016:8020"
    environment:
      - LOG_LEVEL=INFO
      - MAX_YAML_SIZE_BYTES=500000
      - PROCESSING_TIMEOUT_SECONDS=30
    volumes:
      - ./automation-linter/src:/app/src
      - ./automation-linter/ui:/app/ui
      - ../../libs/homeiq-ha/src/homeiq_ha/ha_automation_lint:/app/shared/ha_automation_lint
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=automation-linter,group=automation-core,environment=production"

  automation-trace-service:
    build:
      context: ../..
      dockerfile: domains/automation-core/automation-trace-service/Dockerfile
    container_name: homeiq-automation-trace-service
    restart: unless-stopped
    ports:
      - "8044:8020"
    env_file:
      - ../../.env
    environment:
      - SERVICE_PORT=8020
      - HA_WS_URL=${HA_WS_URL:-ws://homeassistant:8123}
      - HA_HTTP_URL=${HA_HTTP_URL:-http://homeassistant:8123}
      - HA_TOKEN=${HA_TOKEN}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?required}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-homeiq}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-home_assistant_events}
      - DATA_API_URL=http://data-api:8006
      - DATA_API_API_KEY=${DATA_API_API_KEY:-}
      - TRACE_POLL_INTERVAL_SECONDS=${TRACE_POLL_INTERVAL_SECONDS:-120}
      - LOGBOOK_POLL_INTERVAL_SECONDS=${LOGBOOK_POLL_INTERVAL_SECONDS:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # Cross-group depends_on removed (influxdb + data-api in core)
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=automation-trace-service,group=automation-core,environment=production"

  ha-device-control:
    build:
      context: ../..
      dockerfile: domains/automation-core/ha-device-control/Dockerfile
    container_name: homeiq-ha-device-control
    restart: unless-stopped
    ports:
      - "8046:8046"
    env_file:
      - ../../.env
    environment:
      - SERVICE_PORT=8046
      - HA_URL=${HA_URL:-http://homeassistant:8123}
      - HA_TOKEN=${HA_TOKEN}
      - DEFAULT_NOTIFY_SERVICE=${DEFAULT_NOTIFY_SERVICE:-}
      - BLACKLIST_PATTERNS=${DEVICE_BLACKLIST_PATTERNS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8046/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=ha-device-control,group=automation-core,environment=production"

# Automation-core volumes — ai_automation_data owned by ml-engine
volumes:
  # The authoring slice's existing external volume is kept and mounted by the
  # merged process, so its on-disk state survives the fold. The two retired
  # containers' /app/data volumes were local, and automation_domain_data
  # replaces both.
  ai_automation_data:
    external: true
    name: ${AI_AUTOMATION_DATA_VOLUME:-homeiq-ml-engine_ai_automation_data}
  automation_domain_data:

networks:
  homeiq-network:
    external: true
