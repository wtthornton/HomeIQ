# An `upstream {}` block resolves its `server` hostname ONCE, when nginx
# loads the config — it does not consult the `resolver` directive below,
# despite what the previous comment here claimed. Every data-api route uses
# the same set-a-variable-then-proxy_pass pattern as admin-api, ha-proxy,
# log-aggregator, etc. below, so nginx re-resolves data-api on every request
# instead of caching whatever IP it had at container start.

# Note: ha-setup-service upstream removed - using variable-based proxy_pass instead
# This allows nginx to start even if ha-setup-service is not running

# CSRF protection helpers
map $request_method $csrf_required {
    default 0;
    POST 1;
    PUT 1;
    PATCH 1;
    DELETE 1;
}

map "$csrf_required:$http_x_csrf_token:$cookie_homeiq_csrf" $csrf_block {
    "~^0:" 0;
    "~^1:([A-Za-z0-9_-]+):\1$" 0;
    "~^1::" 1;
    "~^1:.*$" 1;
    default 0;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS for dynamic hostname resolution
    # This prevents nginx from caching IPs when containers restart
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 3s;

    # Block state-changing requests without CSRF token + cookie
    if ($csrf_block = 1) {
        return 403;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # === DATA API ROUTES (Feature Data Hub - Port 8006) ===
    # Story 13.2: Events and Devices endpoints migrated to data-api
    
    # Events endpoints → data-api
    location /api/v1/events {
        set $data_api_backend "http://data-api:8006";
        proxy_pass $data_api_backend/api/v1/events;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Credential is injected here, never shipped in the client bundle.
        # ${DASHBOARD_API_KEY} is substituted at container start by the nginx
        # image entrypoint (scoped via NGINX_ENVSUBST_FILTER). Deliberately not
        # forwarding $http_authorization: a caller must not be able to override
        # the injected credential.
        proxy_set_header Authorization "Bearer ${DASHBOARD_API_KEY}";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
    
