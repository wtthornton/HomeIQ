      location /log-aggregator/ {
          # Variable-based proxy_pass + rewrite so nginx re-resolves DNS on every
          # request. A static hostname is resolved once at config load and cached
          # forever, producing 502s after the upstream container restarts.
          # `rewrite ... break` supplies the prefix-stripped URI that the trailing
          # slash used to provide.
          set $log_aggregator "http://log-aggregator:8015";
          rewrite ^/log-aggregator/(.*)$ /$1 break;
          proxy_pass $log_aggregator;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /ai-automation/ {
          # Service runs on port 8025 internally (external port 8036).
          # Variable-based proxy_pass + rewrite: see /log-aggregator/ above.
          set $ai_automation "http://ai-automation-service-new:8025";
          rewrite ^/ai-automation/(.*)$ /$1 break;
          proxy_pass $ai_automation;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
      }

      location /device-intelligence/ {
          # Service runs on port 8019 internally (external port 8028).
          # Variable-based proxy_pass + rewrite: see /log-aggregator/ above.
          set $device_intelligence "http://device-intelligence-service:8019";
          rewrite ^/device-intelligence/(.*)$ /$1 break;
          proxy_pass $device_intelligence;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          # This service authenticates on X-API-Key, not Bearer — its middleware
          # compares the header against settings.API_KEY and 401s otherwise.
          # Injected here so the credential never ships in the client bundle.
          proxy_set_header X-API-Key "${DASHBOARD_API_KEY}";
          proxy_http_version 1.1;
          proxy_set_header Connection "";
      }

      location /weather/ {
          # Proxy to collectors (weather-api folded in, TAP-7274) - use variable
          # with resolver for dynamic DNS resolution. Allows nginx to start
          # even if collectors is not running.
          set $weather_service "http://collectors:8009";
          proxy_pass $weather_service/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Proxy setup-service requests to ha-setup-service.
      # Variable-based proxy_pass + rewrite: see /log-aggregator/ above.
      location /setup-service/ {
          set $ha_setup_service "http://ha-setup-service:8020";
          rewrite ^/setup-service/(.*)$ /$1 break;
          proxy_pass $ha_setup_service;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      # websocket-ingestion REST surface (its /health metrics feed the service
      # cards). The WebSocket upgrade itself is handled by `location /ws` above.
      location /websocket-ingestion/ {
          set $websocket_ingestion_rest "http://websocket-ingestion:8001";
          rewrite ^/websocket-ingestion/(.*)$ /$1 break;
          proxy_pass $websocket_ingestion_rest;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /rag-service/ {
          # TAP-7276: openvino-service + ml-service + rag-service merged into
          # model-server (port 8019). Path kept for existing dashboard clients.
          # Variable-based proxy_pass + rewrite: see /log-aggregator/ above.
          set $rag_service "http://model-server:8019";
          rewrite ^/rag-service/(.*)$ /$1 break;
          proxy_pass $rag_service;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
      }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}