name: homeiq-core-platform
# domains/core-platform/compose.yml — Group 1: core-platform
# The data backbone. If this is down, everything is down.
# Deploy cadence: Low — changes require staging + canary
#
# Services: influxdb, postgres, data-api, websocket-ingestion, admin-api, health-dashboard, data-retention, homeiq-mcp, ha-simulator
# Depends on: Nothing (root of dependency tree)
# Depended on by: All other groups

services:
  influxdb:
    image: influxdb:2.8.0
    container_name: homeiq-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:?required}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-homeiq}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-home_assistant_events}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:?required}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=influxdb,group=core-platform,environment=production"

  postgres:
    # pgvector/pgvector:pg17, not postgres:17-alpine — homeiq-memory declares
    # embedding vector(384) with an HNSW index
    # (libs/homeiq-memory/src/homeiq_memory/models.py:115-118, and alembic
    # revision 004_fix_embedding_dimension_384). The stock image has no
    # pgvector, so CREATE EXTENSION vector fails and memory.memories can never be
    # created, which is what made every /api/v1/memories route 500 (TAP-5437).
    # This is Debian-based where the old tag was Alpine: the PGDATA volume is
    # compatible within major 17, but glibc vs musl collation differs, so run
    # REINDEX DATABASE homeiq once after the first start on this image.
    image: pgvector/pgvector:pg17
    container_name: homeiq-postgres
    restart: unless-stopped
    ports:
      - "${HOMEIQ_POSTGRES_HOST_PORT:-5432}:5432"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      - POSTGRES_DB=homeiq
      - POSTGRES_USER=${POSTGRES_USER:-homeiq}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../../infrastructure/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
      - ../../infrastructure/postgres/init-monitoring.sql:/docker-entrypoint-initdb.d/02-monitoring.sql:ro
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homeiq} -d homeiq"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres,group=core-platform,environment=production"

  data-api:
    build:
      context: ../..
      dockerfile: domains/core-platform/data-api/Dockerfile
    container_name: homeiq-data-api
    restart: unless-stopped
    ports:
      - "8006:8006"
    env_file:
      - ../../.env
    environment:
      - DATA_API_HOST=0.0.0.0
      - DATA_API_PORT=8006
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?required}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-homeiq}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-home_assistant_events}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_AUTH=true
      - API_KEY=${API_KEY:-}
      - CORS_ORIGINS=http://localhost:3000,http://localhost
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-production}
      - OTLP_ENDPOINT=http://jaeger:4317
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER:-homeiq}:${POSTGRES_PASSWORD:?required}@postgres:5432/homeiq
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-homeiq}:${POSTGRES_PASSWORD:?required}@postgres:5432/homeiq
      - DATABASE_SCHEMA=core
      # hygiene routes proxy to device-intelligence; the old localhost:8019
      # fallback dialed the container's own loopback (TAP-5449)
      - DEVICE_INTELLIGENCE_URL=http://device-intelligence-service:8019
    volumes:
      # Per-service integration configs (.env.{service}) served and edited by
      # /api/v1/integrations/{service}/config; config_manager reads the
      # container-relative "infrastructure" dir (TAP-5447).
      - ../../infrastructure/service-configs:/app/infrastructure
    depends_on:
      influxdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=data-api,group=core-platform,environment=production"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  websocket-ingestion:
    build:
      context: ../..
      dockerfile: domains/core-platform/websocket-ingestion/Dockerfile
    container_name: homeiq-websocket
    restart: unless-stopped
    ports:
      - "${HOMEIQ_WSI_HOST_PORT:-8001}:8001"
    env_file:
      - ../../.env
    environment:
      - DOCKER_CONTAINER=true
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-production}
      - HA_HTTP_URL=${HA_HTTP_URL:-}
      - HA_WS_URL=${HA_WS_URL:-}
      - HA_TOKEN=${HA_TOKEN:-}
      - NABU_CASA_URL=${NABU_CASA_URL:-}
      - NABU_CASA_TOKEN=${NABU_CASA_TOKEN:-}
      - DATA_API_URL=http://data-api:8006
      - WEBSOCKET_INGESTION_PORT=8001
      - ENABLE_HOME_ASSISTANT=true
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_USERNAME=admin
      - INFLUXDB_PASSWORD=${INFLUXDB_PASSWORD:?required}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-homeiq}
      - INFLUXDB_BUCKET=home_assistant_events
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?required}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-/app/logs}
      - LOG_FORMAT=json
      - LOG_OUTPUT=both
      - API_KEY=${API_KEY:-}
      - WEBSOCKET_MAX_RETRIES=${WEBSOCKET_MAX_RETRIES:--1}
      - WEBSOCKET_MAX_RETRY_DELAY=${WEBSOCKET_MAX_RETRY_DELAY:-300}
      - STORE_DEVICE_HISTORY_IN_INFLUXDB=${STORE_DEVICE_HISTORY_IN_INFLUXDB:-false}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - WEATHER_API_URL=${WEATHER_API_URL:-https://api.openweathermap.org/data/2.5}
      - WEATHER_DEFAULT_LOCATION=${WEATHER_DEFAULT_LOCATION:-Las Vegas,NV,US}
      - WEATHER_ENRICHMENT_ENABLED=${WEATHER_ENRICHMENT_ENABLED:-true}
      - WEATHER_CACHE_MINUTES=${WEATHER_CACHE_MINUTES:-15}
      - WEATHER_RATE_LIMIT_PER_MINUTE=${WEATHER_RATE_LIMIT_PER_MINUTE:-50}
      - WEATHER_RATE_LIMIT_PER_DAY=${WEATHER_RATE_LIMIT_PER_DAY:-900}
      - WEATHER_REQUEST_TIMEOUT=${WEATHER_REQUEST_TIMEOUT:-10}
      - OTLP_ENDPOINT=http://jaeger:4317
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=websocket-ingestion,group=core-platform,environment=production"
    volumes:
      - homeiq_logs:/var/log/homeiq
    depends_on:
      data-api:
        condition: service_healthy
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  admin-api:
    build:
      context: ../..
      dockerfile: domains/core-platform/admin-api/Dockerfile
    container_name: homeiq-admin
    restart: unless-stopped
    ports:
      - "${HOMEIQ_ADMIN_HOST_PORT:-8004}:8004"
    env_file:
      - ../../.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../infrastructure:/app/infrastructure:rw
      - ../../docker-compose.yml:/app/docker-compose.yml:ro
    # The socket is root:docker on the host; joining the docker group by
    # GID is what lets the non-root container user read it (TAP-5999 —
    # without this the client init fails and docker routes answer 503).
    group_add:
      - "${DOCKER_GID:-984}"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-/app/logs}
      - LOG_FORMAT=json
      - API_HOST=0.0.0.0
      - API_PORT=8004
      - API_KEY=${API_KEY:-}
      - ENABLE_AUTH=false
      - DOCKER_HOST=unix:///var/run/docker.sock
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - HA_HTTP_URL=${HA_HTTP_URL:-${HOME_ASSISTANT_URL:-}}
      - HA_URL=${HA_HTTP_URL:-${HOME_ASSISTANT_URL:-}}
      - HA_TOKEN=${HOME_ASSISTANT_TOKEN:-}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?required}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-homeiq}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-home_assistant_events}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?required}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?required}
      - WEBSOCKET_INGESTION_URL=http://websocket-ingestion:8001
      - DATA_API_URL=http://data-api:8006
      - DEVICE_INTELLIGENCE_API_KEY=${API_KEY:-}
      - AI_AUTOMATION_URL=http://ai-automation-service-new:8025
      - WEATHER_SERVICE_URL=http://weather-api:8009
      - OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      influxdb:
        condition: service_healthy
      websocket-ingestion:
        condition: service_started
      data-api:
        condition: service_healthy
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=admin-api,group=core-platform,environment=production"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  health-dashboard:
    build:
      context: ../..
      dockerfile: domains/core-platform/health-dashboard/Dockerfile
      args:
        - VITE_API_BASE_URL=
        - VITE_DATA_API_URL=
        # Empty = same origin. nginx proxies /ws to websocket-ingestion, so the
        # dashboard's own host:port is always right; a literal port is not,
        # because HOMEIQ_DASHBOARD_HOST_PORT is overridable. Set only to point
        # the SPA at a websocket-ingestion outside this proxy.
        - VITE_WS_INGESTION_URL=${HOMEIQ_WS_INGESTION_URL:-}
        - VITE_ENVIRONMENT=production
    container_name: homeiq-dashboard
    restart: unless-stopped
    ports:
      - "${HOMEIQ_DASHBOARD_HOST_PORT:-3000}:8080"
    environment:
      # Runtime only. nginx substitutes DASHBOARD_API_KEY into its config at
      # container start and injects it as the Authorization header, so the
      # credential never reaches the browser. The VITE_* values below are build
      # -time inputs; they are kept here only for parity with the build args.
      - DASHBOARD_API_KEY=${API_KEY:-}
      - VITE_API_BASE_URL=
      - VITE_DATA_API_URL=
      - VITE_WS_INGESTION_URL=${HOMEIQ_WS_INGESTION_URL:-}
      - VITE_ENVIRONMENT=production
    depends_on:
      admin-api:
        condition: service_healthy
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: '1.0'
        reservations:
          memory: 48M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=health-dashboard,group=core-platform,environment=production"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  data-retention:
    build:
      context: ../..
      dockerfile: domains/core-platform/data-retention/Dockerfile
    container_name: homeiq-data-retention
    restart: unless-stopped
    ports:
      - "${HOMEIQ_RETENTION_HOST_PORT:-8080}:8080"
    env_file:
      - ../../.env
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?required}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-homeiq}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-home_assistant_events}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-/app/logs}
      - LOG_FORMAT=json
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
      - MONITORING_INTERVAL_MINUTES=${MONITORING_INTERVAL_MINUTES:-5}
      - COMPRESSION_INTERVAL_HOURS=${COMPRESSION_INTERVAL_HOURS:-24}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_DIR=${BACKUP_DIR:-/backups}
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '1.0'
        reservations:
          memory: 192M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=data-retention,group=core-platform,environment=production"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - data_retention_backups:/backups

  homeiq-mcp:
    build:
      context: ../..
      dockerfile: domains/core-platform/homeiq-mcp/Dockerfile
    container_name: homeiq-mcp
    restart: unless-stopped
    # HOMEIQ_MCP_BIND narrows the published address (e.g. the docker gateway IP that
    # AgentForge dials, so the port is not LAN-exposed). Bearer auth + Host allowlist
    # guard it either way.
    ports:
      - "${HOMEIQ_MCP_BIND:-0.0.0.0}:8050:8050"
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - ../../.env
    environment:
      - HOMEIQ_MCP_PORT=8050
      - HOMEIQ_MCP_READ_TOKENS=${HOMEIQ_MCP_READ_TOKENS:?required}
      - HOMEIQ_MCP_WRITE_TOKENS=${HOMEIQ_MCP_WRITE_TOKENS:-}
      - HOMEIQ_MCP_ALLOW_WRITES=${HOMEIQ_MCP_ALLOW_WRITES:-}
      - HOMEIQ_MCP_ALLOWED_HOSTS=${HOMEIQ_MCP_ALLOWED_HOSTS:-host.docker.internal}
      - DATA_API_URL=http://data-api:8006
      - API_KEY=${API_KEY:-}
      - PATTERN_SERVICE_URL=http://ai-pattern-service:8020
      - DEVICE_INTELLIGENCE_URL=http://device-intelligence-service:8019
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      data-api:
        condition: service_healthy
    networks:
      - homeiq-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ha-simulator:
    build:
      context: ../..
      dockerfile: domains/core-platform/ha-simulator/Dockerfile
    container_name: homeiq-ha-simulator
    restart: unless-stopped
    ports:
      - "8125:8123"
    env_file:
      - ../../.env
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - homeiq-network
    profiles:
      - development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=ha-simulator,group=core-platform,environment=development"

  # --- Monitoring infrastructure ---

  # --- AlertManager (Epic 79, Story 79.3) ---
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: homeiq-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ../../infrastructure/alertmanager:/etc/alertmanager:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'
        reservations:
          memory: 32M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=alertmanager,group=core-platform,environment=production"

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: homeiq-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Reach Zeek telemetry on host network (Epic 86)
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ../../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../../infrastructure/prometheus/sla-rules.yml:/etc/prometheus/sla-rules.yml:ro
      - ../../infrastructure/prometheus/zeek-alerts.yml:/etc/prometheus/zeek-alerts.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      influxdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=prometheus,group=core-platform,environment=production"

  grafana:
    image: grafana/grafana:11.5.2
    container_name: homeiq-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?required}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '1.0'
        reservations:
          memory: 96M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=grafana,group=core-platform,environment=production"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.0
    container_name: homeiq-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-homeiq}:${POSTGRES_PASSWORD:?required}@postgres:5432/homeiq?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homeiq-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'
        reservations:
          memory: 32M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres-exporter,group=core-platform,environment=production"

  # --- Test profile services ---

  home-assistant-test:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeiq-ha-test
    restart: unless-stopped
    ports:
      - "8124:8123"
    volumes:
      - ha_test_config:/config
      - ha_test_data:/data
    environment:
      - TZ=${TZ:-America/Los_Angeles}
    networks:
      - homeiq-network
    profiles:
      - test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/api/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 384M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=ha-test,group=core-platform,environment=test"

  websocket-ingestion-test:
    build:
      context: ../..
      dockerfile: domains/core-platform/websocket-ingestion/Dockerfile
    container_name: homeiq-websocket-test
    restart: unless-stopped
    ports:
      - "8002:8001"
    env_file:
      - ../../.env
    environment:
      - DOCKER_CONTAINER=true
      - DEPLOYMENT_MODE=test
      - HA_HTTP_URL=http://home-assistant-test:8123
      - HA_WS_URL=http://home-assistant-test:8123/api/websocket
      - HA_TOKEN=${HA_TEST_TOKEN:-}
      - DATA_API_URL=http://data-api:8006
      - WEBSOCKET_INGESTION_PORT=8001
      - ENABLE_HOME_ASSISTANT=true
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_USERNAME=admin
      - INFLUXDB_PASSWORD=${INFLUXDB_PASSWORD:?required}
      - INFLUXDB_ORG=homeiq-test
      - INFLUXDB_BUCKET=home_assistant_events_test
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?required}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-/app/logs}
      - LOG_FORMAT=json
      - LOG_OUTPUT=both
      - API_KEY=${API_KEY:-}
      - WEBSOCKET_MAX_RETRIES=${WEBSOCKET_MAX_RETRIES:--1}
      - WEBSOCKET_MAX_RETRY_DELAY=${WEBSOCKET_MAX_RETRY_DELAY:-300}
      - STORE_DEVICE_HISTORY_IN_INFLUXDB=${STORE_DEVICE_HISTORY_IN_INFLUXDB:-false}
    depends_on:
      home-assistant-test:
        condition: service_healthy
    networks:
      - homeiq-network
    profiles:
      - test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=websocket-ingestion-test,group=core-platform,environment=test"
    volumes:
      - homeiq_logs:/var/log/homeiq

# Core-platform volumes (shared across groups via external references)
volumes:
  influxdb_data:
  influxdb_config:
  postgres_data:
  homeiq_logs:
  data_retention_backups:
  prometheus_data:
  grafana_data:
  ha_test_config:
  ha_test_data:

# Network created by scripts/ensure-network.sh
networks:
  homeiq-network:
    external: true
