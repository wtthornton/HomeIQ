[project]
name = "homeiq"
version = "0.1.0"
description = "HomeIQ - Home automation intelligence platform"
readme = "README.md"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "libs/homeiq-patterns",
    "libs/homeiq-resilience",
    "libs/homeiq-data",
    "libs/homeiq-ha",
    "libs/homeiq-observability",
    "libs/homeiq-memory",
    "libs/homeiq-device-taxonomy",
]

# Members that other members depend on must be resolved from the workspace
# rather than PyPI. homeiq-data requires homeiq-resilience, and homeiq-memory
# requires homeiq-data.
[tool.uv.sources]
homeiq-resilience = { workspace = true }
homeiq-data = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH"]
ignore = ["E501", "B008", "T201"]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests (real Docker/HA); run with pytest -m integration (Epic 53)",
]

[tool.ruff.lint.per-file-ignores]
# Agent-DNA kit scripts are forked from the shared-genome factory repo
# (WebStoreDNA) and re-synced on genome updates. Their uniform-callback
# signatures keep args some callbacks ignore (ARG001) and their import style
# predates this repo's TC00x preference; rewriting them would create permanent
# divergence from the factory source the drift check exists to track.
"scripts/af_suite_diff.py" = ["ARG001"]
"scripts/render_dna_core.py" = ["ARG001", "TC003"]
"scripts/kit_checks.py" = ["TC003"]
"scripts/input_source.py" = ["TC003"]
# The kit's own test suite (also factory-forked; ARG001/E402 for the same reason
# the general tests/** entry below exists, plus the factory import style).
"tests/genome_kit/**" = ["ARG001", "TC003", "SIM300", "E402"]

# E402: Imports must follow sys.path setup for shared module resolution
"domains/core-platform/admin-api/src/main.py" = ["E402"]
"domains/core-platform/data-api/src/main.py" = ["E402"]
"domains/core-platform/websocket-ingestion/src/main.py" = ["E402"]
"domains/energy-analytics/proactive-agent-service/src/main.py" = ["E402"]

# Tests, for the same E402 reason as above plus one specific to pytest.
#
# ARG001/ARG002: pytest injects fixtures by *parameter name*. A fixture
# requested purely for its side effect — setting env vars, installing a patch —
# is therefore an argument that is never referenced, and the usual remedy of
# renaming it to `_name` breaks the injection outright, because pytest would
# then look for a fixture called `_name`. The rule is reporting the pytest
# calling convention, not a defect.
#
# Kept narrow on purpose: this applies under tests/ only. Both rules stay
# enforced on src/, where an unused argument or a misplaced import is real.
"domains/*/*/tests/**" = ["ARG001", "ARG002", "E402"]

# TC001/TC002/TC003 assume an annotation is never evaluated at run time. That is
# false for SQLAlchemy declarative models and Pydantic models: both call
# eval() on the annotation string (SQLAlchemy in de_stringify_annotation,
# Pydantic when building the core schema), so moving such an import into a
# TYPE_CHECKING block turns a working module into an import-time NameError.
# Declaring the runtime-evaluated bases makes the rules accurate rather than
# muting them — the rules stay enabled everywhere, and enabling this surfaced
# two live defects (zeek baseline_hosts.py, device-intelligence devices.py)
# where the import had already been moved and the module could not be imported.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
    "src.database.Base",
]
