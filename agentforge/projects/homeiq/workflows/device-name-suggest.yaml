# Propose display names for one Home Assistant device (TAP-7275).
#
# Serves device-intelligence-service's AINameSuggester, which is what remains of
# that service's LLM slice after this lane. The device is resolved by its durable
# identity before the call and the accepted name is applied against that identity
# afterwards; a display name is a customer-facing artifact and never an
# identifier the system reasons over.

name: device-name-suggest
spec_version: 2

inputs:
  - name: device
    type: string
    required: true
    description: "JSON device record: manufacturer, model, area, device class, entity roles"
  - name: convention
    type: string
    required: false
    description: "This home's naming convention, including its prohibitions"
    default: ""

on_error: fail

nodes:
  name_device:
    kind: task
    agent: hiq-device-name
    inputs:
      device: $device
      convention: $convention
    output_repair_retries: 1
    output_schema:
      type: object
      required: [suggestions]
      additionalProperties: false
      properties:
        suggestions:
          type: array
          maxItems: 5
          items:
            type: object
            required: [name, confidence, reasoning]
            additionalProperties: false
            properties:
              name: {type: string}
              confidence: {type: number, minimum: 0, maximum: 1}
              reasoning: {type: string}

output: name_device
