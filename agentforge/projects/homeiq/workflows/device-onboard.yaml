# Onboard one device model: identify it from its signature, then curate the facts.
#
# scout -> curate. Two nodes, not three: the recall step that opens device-kb-enrich
# is unnecessary here because the caller supplies the cache directly. HomeIQ reads
# devices.device_knowledge_claims and hands it in as `known`, which is a stronger
# cache than ambient recall — it is the actual store the facts will be written to,
# so a hit means the answer is already durable rather than merely remembered.
#
# The scout holds search capability and no write capability; hiq-device-kb-curator
# holds neither search nor HTTP. Its `approved` array is the complete set of claim
# bodies the caller may POST to /api/device-knowledge/claims, and the caller relays
# it verbatim (scripts/relay_curated_claims.py adds no judgement). The chokepoint is
# the TOOL GRANT, not the network: device-intelligence publishes 8028 on 0.0.0.0 and
# any container reaches it over the host gateway.
#
# Cost shape, measured 2026-08-21 on samsung electronics/un65tu700dfxza:
#   cold (known: [])          2 searches, $0.437, 61s
#   warm (known: 3 facts)     0 searches, $0.068,  6s
# The cache is why this can run on every discovery pass without being reckless.
name: device-onboard
spec_version: 2

inputs:
  - name: signature
    description: "Protocol-native identity and fingerprint collected by HomeIQ: integration, protocol, manufacturer, model, model_id, ieee/mac, entity_domains. Fields may be Unknown; that is the case the scout exists for."
  - name: subject_key
    description: "Claim subject key, lowercased manufacturer/model. Empty when the model is unknown and the scout must establish it first."
  - name: known
    description: "THE CACHE. Facts already in devices.device_knowledge_claims for this subject, as returned by GET /api/device-knowledge/models/{manufacturer}/{model}. Empty array on first sight."
  - name: wanted
    description: "fact_keys the caller needs. Empty means the scout uses judgement."

nodes:
  scout:
    kind: task
    agent: hiq-device-scout
    inputs:
      signature: $signature
      known: $known
      wanted: $wanted
    output_repair_retries: 2
    output_schema:
      type: object
      additionalProperties: false
      required: [identified, facts, not_established, cache_hits, searches_performed, sources_consulted]
      properties:
        identified:
          type: object
          additionalProperties: false
          required: [confidence, basis]
          properties:
            manufacturer: {type: string}
            model: {type: string}
            subject_key: {type: string}
            confidence: {type: number, minimum: 0, maximum: 1}
            # Naming a friendly name here is a failure, not a style choice.
            basis: {type: string}
        facts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fact_key, fact_value, evidence_class, source_url, source_quote, confidence]
            properties:
              fact_key: {type: string}
              fact_value: {type: string, minLength: 1}
              # measured is deliberately absent: this gene reads documents, it
              # takes no reading off hardware.
              evidence_class: {type: string, enum: [upstream_source, vendor_doc, community, inferred]}
              source_url: {type: string, minLength: 8}
              source_quote: {type: string, minLength: 1}
              source_ref: {type: string}
              source_version: {type: string}
              confidence: {type: number, minimum: 0, maximum: 1}
              caveat: {type: string}
        not_established:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fact_key, reason]
            properties:
              fact_key: {type: string}
              reason: {type: string}
        cache_hits:
          type: array
          items: {type: string}
        searches_performed: {type: integer, minimum: 0}
        sources_consulted:
          type: array
          items: {type: string}

  curate:
    kind: task
    agent: hiq-device-kb-curator
    depends_on: [scout]
    inputs:
      subject_kind: "model"
      subject_key: $subject_key
      recorded_by: "hiq-device-kb-curator"
      proposed: $scout
      stored_claims: $known
    output_repair_retries: 2
    output_schema:
      type: object
      additionalProperties: false
      required: [approved, refused, superseded, summary]
      properties:
        approved:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [subject_kind, subject_key, fact_key, fact_value, evidence_class, claim_type, recorded_by]
            properties:
              subject_kind: {type: string, enum: [model, instance]}
              subject_key: {type: string, minLength: 1, maxLength: 255}
              fact_key: {type: string, minLength: 1, maxLength: 255}
              fact_value: {type: string, minLength: 1}
              # The full five-class CHECK set. The curator MAY approve a measured
              # claim handed to it from an instrument-backed source; the scout may
              # never propose one.
              evidence_class: {type: string, enum: [measured, upstream_source, vendor_doc, community, inferred]}
              claim_type: {type: string, enum: [known, not_claimed]}
              caveat: {type: string}
              source_url: {type: string}
              source_ref: {type: string}
              source_version: {type: string, maxLength: 255}
              source_quote: {type: string}
              method: {type: string, maxLength: 255}
              confidence: {type: number, minimum: 0, maximum: 1}
              firmware_min: {type: string, maxLength: 32}
              firmware_max: {type: string, maxLength: 32}
              recorded_by: {type: string, minLength: 1, maxLength: 128}
        refused:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fact_key, reason_code, reason]
            properties:
              fact_key: {type: string}
              reason_code:
                type: string
                enum: [invalid_evidence_class, name_derived, provenance_inflated, missing_source, malformed_field, duplicate_of_stored, out_of_vocabulary]
              reason: {type: string}
        superseded:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [supersedes_id, fact_key, superseded_reason]
            properties:
              supersedes_id: {type: integer}
              fact_key: {type: string}
              superseded_reason: {type: string}
        summary: {type: string}

output: curate
on_error: fail
