# Reactive anomaly triage and investigation.
#
# Triggers on derived events (topic: homeiq.anomaly.detected, never raw HA
# state — per epic TAP-5431 note). Fallback schedule every 6 hours to catch
# anomalies not wired to event. Debounce semantics in comment below.
#
# Flow: hiq-anomaly-triage → hiq-explain-anomaly (provides causal hypotheses)
# → short-circuit transform (skip notify if no acted_on items) → hiq-notify
# (only when actions taken).
#
# Debounce: The derived topic fires when an anomaly is detected and queued
# for triage, not on every state change. homeiq.anomaly.detected is the
# event trigger; the parent detector (device health monitor, energy usage
# monitor, etc.) handles debounce at source. This workflow's schedule fires
# every 6h to catch detectors that may be offline or miss an event — a
# failsafe, not the primary cadence.

name: anomaly-triage
spec_version: 2

on_error: partial

goal:
  description: >-
    Anomalies detected in the last window are triaged and explained. The
    workflow skips notification if no anomalies warrant action (triage:
    acted_on); otherwise, an alert carries the anomaly summary, the most
    likely cause (hiq-explain-anomaly hypothesis), confidence, and evidence.
  verify:
    kind: judge
    expression: triage.summary

nodes:
  triage:
    kind: task
    agent: hiq-anomaly-triage
    inputs:
      health_status_filter: all
    output_repair_retries: 1
    output_schema:
      type: object
      required: [triage_results, summary, errors]
      properties:
        triage_results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [anomaly_id, kind, severity, triage, reasoning]
            properties:
              anomaly_id: {type: string}
              kind: {type: string}
              entity_id: {type: [string, "null"]}
              device_id: {type: [string, "null"]}
              severity: {type: string}
              triage: {type: string, enum: [acted_on, watch, dismiss]}
              reasoning: {type: string}
              evidence: {type: array, items: {type: string}}
          maxItems: 100
        summary:
          type: object
          additionalProperties: false
          required: [total_anomalies, acted_on_count]
          properties:
            total_anomalies: {type: integer}
            acted_on_count: {type: integer}
            watch_count: {type: integer}
            dismiss_count: {type: integer}
        errors: {type: array, items: {type: string}}

  explain:
    kind: task
    agent: hiq-explain-anomaly
    depends_on: [triage]
    inputs:
      anomalies: $triage.triage_results
    output_repair_retries: 1
    output_schema:
      type: object
      required: [entity_id, confidence, hypothesis, evidence_trail, causal_chain, assessment_status]
      properties:
        entity_id: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        hypothesis: {type: string}
        evidence_trail: {type: array, items: {type: string}}
        causal_chain:
          type: [array, "null"]
          items:
            type: object
            additionalProperties: false
            properties:
              depth: {type: integer}
              event_type: {type: string}
              entity_id: {type: string}
              state: {type: [string, "null"]}
              t: {type: string, format: date-time}
          maxItems: 20
        limitations: {type: array, items: {type: string}}
        assessment_status: {type: string, enum: [blocked, complete, needs_revision, skipped]}

  # Short-circuit logic: only notify if triage found anomalies that warrant
  # action signal: the triage gene already counts acted_on items; the transform
  # exposes that as a boolean the notify template leads with. AF's sandboxed
  # transform expressions allow no comprehensions, so the gene owns the split
  # and this node only reads the count. Notify always delivers the digest —
  # leading with "no action needed" when has_actions is false — because the
  # platform has no conditional-skip node and a human gate would pause the run.
  filter_for_action:
    kind: transform
    depends_on: [triage]
    inputs:
      acted_on_count: $triage.summary.acted_on_count
    expression: '{"has_actions": (acted_on_count or 0) > 0, "acted_on_count": acted_on_count or 0}'

  notify:
    kind: task
    agent: hiq-notify
    depends_on: [filter_for_action, explain]
    inputs:
      message:
        has_actions: $filter_for_action.has_actions
        acted_on_count: $filter_for_action.acted_on_count
        triage: $triage.triage_results
        explanation: $explain
    output_repair_retries: 1
    output_schema:
      type: object
      required: [status, attempts]
      properties:
        status: {type: string, enum: [sent, dlq, rejected]}
        attempts: {type: integer}
        dlq_key: {type: string}
        error: {type: string}

output: triage

triggers:
  # Event trigger on derived topic (TAP-5431): fires when anomaly is detected
  # and queued for triage. Debounce is handled by the parent detector at source.
  - type: event
    topic: homeiq.anomaly.detected
  # Fallback schedule every 6 hours to catch detectors that may be offline
  # or miss an event. Ensures anomalies don't go unreviewed if event missed.
  - type: schedule
    cron: "0 */6 * * *"
