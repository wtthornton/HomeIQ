[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homeiq-observability"
version = "1.0.0"
description = "HomeIQ observability: metrics, logging, monitoring, alerting, tracing"
requires-python = ">=3.11"
dependencies = [
    "structlog>=23.0",
    "psutil>=5.9.0",
    "aiohttp>=3.13.3,<4.0.0",
    # alerting_service.py imports it at module level; undeclared, it only
    # resolved locally by venv coincidence — the first live libs-ci run
    # caught it (TAP-6037).
    "requests>=2.31",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
prometheus = [
    "prometheus-client>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]
