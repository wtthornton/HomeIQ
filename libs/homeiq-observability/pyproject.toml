[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homeiq-observability"
version = "1.0.0"
description = "HomeIQ observability: metrics, logging, monitoring, alerting, tracing"
requires-python = ">=3.11"
dependencies = [
    "structlog>=23.0",
    "psutil>=5.9.0",
    "aiohttp>=3.13.3,<4.0.0",
    # alerting_service.py imports it at module level; undeclared, it only
    # resolved locally by venv coincidence — the first live libs-ci run
    # caught it (TAP-6037).
    "requests>=2.31",
    # monitoring_endpoints.py imports homeiq_data.auth (needs the [auth]
    # extra: jose/passlib/fastapi) and stats_endpoints.py imports its
    # influxdb client — a cross-lib dependency that was never declared;
    # the second live libs-ci run caught it (TAP-6037).
    "homeiq-data[auth]>=1.0.0",
    "fastapi>=0.110",
    # metrics_api.py imports influxdb_client directly; endpoints use pydantic
    # BaseModel directly; observability/correlation.py imports starlette directly.
    # All three were resolving only via other libs' own deps (TAP-6066).
    "influxdb-client>=1.36",
    "pydantic>=2.0",
    "starlette>=0.37",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
prometheus = [
    "prometheus-client>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]
