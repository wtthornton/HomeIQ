[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homeiq-ha"
version = "1.0.0"
description = "HomeIQ Home Assistant integration: connection manager, automation lint engine"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.3",
    # >=13.0, not >=12.0: client/ws.py imports websockets.asyncio.client, and the
    # websockets/asyncio/ package does not exist in 12.0 (verified by installing
    # both). Declaring 12.0 let consumers resolve a version that cannot import
    # this library at all.
    "websockets>=13.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The ZHA quirks are Python source deployed verbatim to the Home Assistant
# host, not modules this package imports; they are data as far as it is
# concerned, and agent/quirks/ deliberately has no __init__.py.
"homeiq_ha.agent" = ["quirks/*.py"]
"homeiq_ha.homeiq_automation" = ["*.json"]
"homeiq_ha.yaml_validation_service" = ["*.json"]
