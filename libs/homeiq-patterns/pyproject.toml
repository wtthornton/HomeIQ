[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homeiq-patterns"
version = "1.0.0"
description = "HomeIQ reusable patterns: RAGContextService, UnifiedValidationRouter, PostActionVerifier"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "aiohttp>=3.13.3",
    "fastapi>=0.100",
    # store.py imports sqlalchemy at module level; evaluators/l3_yaml_completeness.py
    # imports yaml at module level — both were resolving by venv coincidence (TAP-6066).
    "sqlalchemy[asyncio]>=2.0.36",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# evaluation.llm_judge lazily imports these per-provider; an extra rather than
# core since most consumers never instantiate a judge (TAP-6066).
llm-judge = [
    "anthropic>=0.40",
    "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
