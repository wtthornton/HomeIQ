[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homeiq-data"
version = "2.0.0"
description = "HomeIQ data access: InfluxDB client, database pool, caching, service client, auth, BaseSettings, DataAPIClient, OpenAI client"
requires-python = ">=3.11"
dependencies = [
    "influxdb-client>=1.36",
    "aiohttp>=3.13.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "homeiq-resilience>=1.0.0",
    # service_client.py imports httpx unconditionally; openai_client.py imports
    # tenacity unconditionally and is eagerly loaded by __init__.py. Both were
    # resolving only via homeiq-resilience's own deps (TAP-6066).
    "httpx>=0.25",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# homeiq_data.auth pulls in a web framework and crypto stack that pure-data
# consumers do not need. Install homeiq-data[auth] to use AuthManager.
auth = [
    "fastapi>=0.110",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]
postgres = [
    "psycopg[binary]>=3.2.0",
]
openai = [
    "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
