# Reuse tiers for the packs this export shipped. The exporting kit's
# species- and deployment-tier packs are withheld by design, so they are
# absent here too — a pack classified but not present fails the gate.
skills:
  agentic-surface:
    tier: domain
    why: "The machine-readable surface of a storefront \u2014 UCP profile ownership,\
      \ MCP cart/checkout/catalog endpoints, agentic-catalog eligibility, and the\
      \ product route shape. Commerce-specific but names no gene. The third dated\
      \ pack; carries verified_at/expires per L14, and needs it more than the others\
      \ \u2014 two tool families were renamed and removed in the four months before\
      \ it was written."
  ai-disclosure-matrix:
    tier: core
    why: "Per-channel AI-disclosure decision table across platform and statutory regimes.\
      \ Applies to any species that publishes generated content. The only dated pack\
      \ \u2014 carries verified_at/expires per L14, so re-verify on adoption."
  automation-safety-rules:
    tier: deployment
    why: "Hard-deny list for unsafe automation patterns (lock unlocking, alarm disarming,\
      \ safety detector disablement). Everything outside the deny list is annotate-only\
      \ risk scoring. HomeIQ-specific; consumed by hiq-draft-automation and hiq-judge-automation\
      \ genes."
  cx-guardrails:
    tier: domain
    why: What a customer-facing reply may assert from retrieved evidence and what
      it may never promise. Commerce-specific, but names no gene.
  energy-truth:
    tier: deployment
    why: "Authoritative energy metric definitions and source-authority rules (smart\
      \ meter authoritative for whole-home watts; Powercalc for unmetered device estimates;\
      \ carbon from service only). HomeIQ-specific; consumed by hiq-correlate gene."
  ha-yaml-rules:
    tier: deployment
    why: "Home Assistant 2026.x automation YAML correctness rules (15 linter rules).\
      \ Enables retiring the linter container. HomeIQ-specific; consumed by hiq-draft-automation\
      \ and hiq-judge-automation genes. Source of truth is docs/automation-linter-rules.md."
  home-atlas:
    tier: deployment
    why: "Home structural ground truth, rendered from dna-core/intake/homeiq.yaml\
      \ (itself generated from the live instance by scripts/generate_home_intake.py).\
      \ Every claim carries how it was established, ordered measured >\
      \ upstream_source > attestation > unverified, and a claim whose only signal\
      \ is a friendly name is typed unverified and non-actionable so a gene\
      \ abstains. The previous authority, config/ha-organization-manifest.yaml,\
      \ justified device->area rows by name-string matching and was measurably\
      \ wrong. HomeIQ-specific; consumed by entity resolution and automation genes."
  home-taxonomy:
    tier: deployment
    why: "Device event types, anomaly labels, maintenance events, and integration\
      \ identity labels for hiq-classify gene. HomeIQ-specific; source is skills/home-taxonomy/SKILL.md."
  kpi-truth:
    tier: domain
    why: Source-authority rules for commerce metrics and which cross-platform discrepancies
      are expected. Commerce-specific, but names no gene.
  passk-eval:
    tier: core
    why: Golden-case trial counts and pass^k thresholds by gene role. Pure agent-eval
      discipline; the one product-description example is illustrative, not structural.
  site-compliance:
    tier: domain
    why: "Privacy policy/consent/accessibility/price-display regimes for any storefront.\
      \ Commerce-specific (price-display rules only apply to a seller), but names\
      \ no gene \u2014 the pool audit gene that will consume it is not built in Phase\
      \ 0. The second dated pack alongside ai-disclosure-matrix; carries verified_at/expires\
      \ per L14."
