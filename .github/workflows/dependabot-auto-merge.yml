# .github/workflows/dependabot-auto-merge.yml
# Generated by TappsMCP tapps_init — edit as needed
# Auto-approves and auto-merges Dependabot PRs for minor/patch updates.
#
# DISABLED ON PURPOSE — do not `gh workflow enable` this without reading below.
#
# State: disabled_manually at the GitHub API level (workflow id 240581071). The
# file is intentionally left in place rather than deleted so the rationale
# travels with it.
#
# Why it is off:
#   1. It squash-merges to master with no human in the loop. `--auto` waits on
#      required checks, but this repo currently has none enforced on master, so
#      in practice it is an unattended write to the default branch.
#   2. It covers semver-MINOR as well as patch. A minor bump can change
#      behaviour, and nothing here runs the stack before merging.
#   3. quality-gate and agentic-pr-review are red (TappsMCP has no working pip
#      install — see the CI Integration section of the claude-md file). Merging
#      on green is meaningless while the gates cannot run at all.
#
# Before re-enabling, at minimum: make the quality gates pass, mark them
# required on master, and narrow the trigger to semver-patch only.
#
# Note for auditors: this being off is a deliberate decision, NOT the same fault
# as the 18 workflows found disabled_manually in session 8. Those were an
# accidental outage and were re-enabled; this one stays off.
name: Dependabot Auto-Merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-approve patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
