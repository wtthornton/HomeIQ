name: Group CI (Reusable)

on:
  workflow_call:
    inputs:
      group_name:
        required: true
        type: string
        description: "Name of the service group (e.g., core, collectors, ml)"
      domain_dir:
        required: true
        type: string
        description: "Domain directory under domains/ (e.g., core-platform, data-collectors)"
      services:
        required: true
        type: string
        description: "JSON array of service directory names"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: "CI — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ inputs.group_name }}-${{ matrix.service }}-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        # pgvector/pgvector:pg17, not postgres:17-alpine — the same reason
        # domains/core-platform/compose.yml:51-55 gives. init-schemas.sql runs
        # `CREATE EXTENSION IF NOT EXISTS vector`, which stock postgres cannot
        # satisfy, so the memory schema came up with zero tables.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: homeiq
          POSTGRES_PASSWORD: homeiq_test
          POSTGRES_DB: homeiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        service: ${{ fromJson(inputs.services) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        # Pinned: an unpinned ruff makes the lint gate a moving target. 0.16.0
        # expanded the default rule set from 59 to 413 rules, so a bare
        # `pip install ruff` can turn a green commit red with no change to this
        # repo. Bump this deliberately, in its own PR, with the diff reviewed.
        run: pip install ruff==0.15.15

      - name: Lint with ruff
        run: ruff check domains/${{ inputs.domain_dir }}/${{ matrix.service }}/

      - name: Check formatting with ruff
        run: ruff format --check domains/${{ inputs.domain_dir }}/${{ matrix.service }}/

      - name: Validate Dockerfile shared libs
        run: python scripts/validate-dockerfile-libs.py --strict

      - name: Install shared libraries
        run: |
          # One pip invocation, not a loop. The libs depend on each other
          # (homeiq-data -> homeiq-resilience, homeiq-memory -> homeiq-data) and
          # none of them is published to PyPI. Installing one at a time resolves
          # each in isolation, so the first lib alphabetically — homeiq-data —
          # looks for homeiq-resilience on the index and 404s. Passing all six
          # paths at once puts them in a single resolution pass, which is what
          # the 52 service Dockerfiles already do.
          #
          # No `|| true`: a shared library that fails to install must fail the
          # job here, not surface later as confusing import errors in tests.
          pip install libs/homeiq-*/

      - name: Check if service has requirements
        id: check-requirements
        run: |
          if [ -f "domains/${{ inputs.domain_dir }}/${{ matrix.service }}/requirements.txt" ]; then
            echo "has_requirements=true" >> $GITHUB_OUTPUT
          else
            echo "has_requirements=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check-requirements.outputs.has_requirements == 'true'
        run: |
          pip install -r domains/${{ inputs.domain_dir }}/${{ matrix.service }}/requirements.txt
          # pytest-cov belongs here, not in 19 pytest.ini files. Those services
          # put `--cov=src` in addopts, and pytest treats an unknown addopt as a
          # usage error: `unrecognized arguments: --cov=src`, exit 4, zero tests
          # collected. The step was failing before it ran a single test. Every
          # one of those 19 services has a requirements.txt, so this step reaches
          # all of them. Stripping --cov instead would have discarded coverage
          # signal the repo deliberately configured.
          pip install pytest pytest-asyncio pytest-timeout pytest-cov

      - name: Initialize PostgreSQL schemas
        run: |
          # -v ON_ERROR_STOP=1: without it psql reports errors and still exits 0.
          # That is how this step stayed green while `CREATE EXTENSION vector`
          # failed and the memory schema came up with zero tables.
          PGPASSWORD=homeiq_test psql -v ON_ERROR_STOP=1 -h localhost -U homeiq -d homeiq_test -f infrastructure/postgres/init-schemas.sql
        env:
          PGPASSWORD: homeiq_test

      - name: Check if service has tests
        id: check-tests
        run: |
          if [ -d "domains/${{ inputs.domain_dir }}/${{ matrix.service }}/tests" ] && \
             [ -n "$(find domains/${{ inputs.domain_dir }}/${{ matrix.service }}/tests -name 'test_*.py' -o -name '*_test.py' 2>/dev/null)" ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.check-tests.outputs.has_tests == 'true'
        run: |
          cd domains/${{ inputs.domain_dir }}/${{ matrix.service }}
          pytest tests/ -v --timeout=300
        env:
          POSTGRES_URL: postgresql+asyncpg://homeiq:homeiq_test@localhost:5432/homeiq_test
          # data-api's conftest reads TEST_DATABASE_URL; without it the tests
          # fell back to a hardcoded localhost URL with the wrong password.
          TEST_DATABASE_URL: postgresql+asyncpg://homeiq:homeiq_test@localhost:5432/homeiq_test
          DATABASE_URL: postgresql+asyncpg://homeiq:homeiq_test@localhost:5432/homeiq_test

      - name: Test Alembic migrations
        if: hashFiles(format('{0}/alembic.ini', format('domains/{0}/{1}', inputs.domain_dir, matrix.service))) != ''
        run: |
          cd domains/${{ inputs.domain_dir }}/${{ matrix.service }}
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
        env:
          POSTGRES_URL: postgresql+asyncpg://homeiq:homeiq_test@localhost:5432/homeiq_test

      - name: Report no tests
        if: steps.check-tests.outputs.has_tests == 'false'
        run: echo "No tests found for ${{ matrix.service }} — skipping test step"
