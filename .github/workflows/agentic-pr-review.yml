# .github/workflows/agentic-pr-review.yml
# Generated by TappsMCP tapps_init — agentic workflow (technical preview)
# Requires GitHub Agentic Workflows to be enabled for the repository.
name: Agentic PR Quality Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          # TappsMCP is not published to PyPI — `pip install tapps-mcp` resolves to
          # nothing and fails the job. Install from the public repo, pinned so CI is
          # reproducible and an upstream change cannot silently alter a review result.
          pip install "git+https://github.com/wtthornton/TappsMCP.git@v3.12.65"
          pip install ruff mypy bandit radon vulture

      - name: Run quality analysis on changed files
        env:
          TAPPS_MCP_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          tapps-mcp validate-changed --preset strict
