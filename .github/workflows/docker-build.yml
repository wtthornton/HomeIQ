name: Docker Build and Test

on:
  pull_request:
    paths:
      # Root-level and nested patterns are both listed: GitHub's path matcher
      # treats '*' as not crossing '/', and '**/x' is not documented to match
      # a root-level 'x', so the bare patterns keep root compose files covered.
      - '**/Dockerfile*'
      - 'docker-compose*.yml'
      - 'compose*.yml'
      - '**/docker-compose*.yml'
      - '**/compose*.yml'
      - 'infrastructure/backup/backup-scheduler.yml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch: {}

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  compose-parse:
    name: Parse Tracked Compose Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      # A file with a compose extension that fails YAML parsing breaks every
      # tool that sweeps compose files (TAP-5289's fragment did exactly that).
      # Compose files that dodge the standard names (EXTRA_COMPOSE_FILES) are
      # parse-checked too, and any parseable YAML that looks like a compose
      # file under a nonstandard name fails the job until it is renamed or
      # listed — otherwise it would sit permanently outside this guard.
      - name: YAML-parse every tracked compose file
        run: |
          python3 - <<'PY'
          import subprocess, sys, yaml

          EXTRA_COMPOSE_FILES = {
              "infrastructure/backup/backup-scheduler.yml",
          }

          def is_compose_shaped(docs):
              for doc in docs:
                  if not isinstance(doc, dict):
                      continue
                  services = doc.get("services")
                  if isinstance(services, dict) and any(
                      isinstance(s, dict) and ("image" in s or "build" in s)
                      for s in services.values()
                  ):
                      return True
              return False

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          yaml_files = [f for f in files if f.endswith((".yml", ".yaml"))]
          compose = [
              f for f in yaml_files
              if f.rsplit("/", 1)[-1].startswith(("compose", "docker-compose"))
              or f in EXTRA_COMPOSE_FILES
          ]

          failed = False
          for f in compose:
              try:
                  with open(f) as fh:
                      list(yaml.safe_load_all(fh))
              except yaml.YAMLError as exc:
                  print(f"FAIL {f}: does not parse: {exc}")
                  failed = True

          for f in yaml_files:
              if f in compose:
                  continue
              try:
                  with open(f) as fh:
                      docs = list(yaml.safe_load_all(fh))
              except yaml.YAMLError:
                  continue  # not classifiable as compose; out of scope
              if is_compose_shaped(docs):
                  print(
                      f"FAIL {f}: compose-shaped file with a nonstandard name — "
                      "rename to compose*.yml / docker-compose*.yml or add it to "
                      "EXTRA_COMPOSE_FILES in .github/workflows/docker-build.yml"
                  )
                  failed = True

          print(f"checked {len(compose)} compose files")
          sys.exit(1 if failed else 0)
          PY

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - websocket-ingestion
          - data-api
          - admin-api
          - weather-api
          - health-dashboard
          - ai-automation-service-new
          - ai-automation-ui
          - carbon-intensity-service
          - electricity-pricing-service
          - air-quality-service
          - calendar-service
          - smart-meter-service
          - energy-correlator
          - energy-forecasting
          - log-aggregator
          - ml-service
          - ai-core-service
          - ai-pattern-service
          - ai-query-service
          - ai-training-service
          - ha-ai-agent-service
          - proactive-agent-service
          - device-intelligence-service
          - automation-miner
          - openvino-service
          - ha-setup-service
          - data-retention
          - device-setup-assistant
          - device-database-client
          - device-recommender
          - device-context-classifier
          - yaml-validation-service
          - blueprint-index
          - blueprint-suggestion-service
          - rule-recommendation-ml
          - ai-code-executor
          - automation-trace-service
          - automation-linter
          - api-automation-edge
          - device-health-monitor
          - activity-recognition
          - activity-writer
          - rag-service
          - observability-dashboard
          - sports-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Dockerfile shared libs
        run: python scripts/validate-dockerfile-libs.py --strict

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Dockerfile exists
        id: check-dockerfile
        run: |
          DOCKERFILE=$(find domains -path "*/${{ matrix.service }}/Dockerfile" -print -quit)
          if [ -n "$DOCKERFILE" ]; then
            echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Dockerfile found for ${{ matrix.service }} at $DOCKERFILE"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Dockerfile not found for ${{ matrix.service }}, skipping build"
          fi

      - name: Build Docker image
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.check-dockerfile.outputs.dockerfile }}
          push: false
          tags: |
            homeiq-${{ matrix.service }}:latest
            ghcr.io/wtthornton/homeiq-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Test image
        if: steps.check-dockerfile.outputs.exists == 'true'
        run: |
          docker run --rm homeiq-${{ matrix.service }}:latest --help || true

  build-all:
    name: Build All Services (Parallel)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all services in parallel
        run: |
          echo "::group::Build Performance"
          BUILD_START=$(date +%s)
          docker compose build --parallel
          BUILD_END=$(date +%s)
          BUILD_DURATION=$((BUILD_END - BUILD_START))
          BUILD_MINUTES=$((BUILD_DURATION / 60))
          BUILD_SECONDS=$((BUILD_DURATION % 60))
          echo "::notice title=Build Time::Build completed in ${BUILD_MINUTES}m ${BUILD_SECONDS}s"
          echo "BUILD_DURATION=${BUILD_DURATION}" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: Verify build
        run: |
          docker compose config --services | wc -l

      - name: Build Performance Summary
        if: always()
        run: |
          echo "## Build Performance" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Duration:** ${BUILD_DURATION}s (${BUILD_MINUTES}m ${BUILD_SECONDS}s)" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type:** Parallel" >> $GITHUB_STEP_SUMMARY
          echo "- **Optimizations:** BuildKit enabled, parallel builds" >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - websocket-ingestion
          - data-api
          - admin-api
          - weather-api
          - health-dashboard
          - ai-automation-service-new
          - ai-automation-ui
          - carbon-intensity-service
          - electricity-pricing-service
          - air-quality-service
          - calendar-service
          - smart-meter-service
          - energy-correlator
          - energy-forecasting
          - log-aggregator
          - ml-service
          - ai-core-service
          - ai-pattern-service
          - ai-query-service
          - ai-training-service
          - ha-ai-agent-service
          - proactive-agent-service
          - device-intelligence-service
          - automation-miner
          - openvino-service
          - ha-setup-service
          - data-retention
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if Dockerfile exists
        id: check-dockerfile-scan
        run: |
          DOCKERFILE=$(find domains -path "*/${{ matrix.service }}/Dockerfile" -print -quit)
          if [ -n "$DOCKERFILE" ]; then
            echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Dockerfile found for ${{ matrix.service }} at $DOCKERFILE"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Dockerfile not found for ${{ matrix.service }}, skipping scan"
          fi

      - name: Build image for scanning
        if: steps.check-dockerfile-scan.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.check-dockerfile-scan.outputs.dockerfile }}
          push: false
          tags: scan-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (filesystem)
        if: steps.check-dockerfile-scan.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (image)
        if: steps.check-dockerfile-scan.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'scan-${{ matrix.service }}:latest'
          format: 'sarif'
          output: 'trivy-image-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy filesystem results to GitHub Security
        if: steps.check-dockerfile-scan.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs-${{ matrix.service }}.sarif'

      - name: Upload Trivy image results to GitHub Security
        if: steps.check-dockerfile-scan.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image-${{ matrix.service }}.sarif'
