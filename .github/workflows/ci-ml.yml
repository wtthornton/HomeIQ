name: "CI — ML Engine"

on:
  push:
    branches: [master, main]
    paths:
      - 'domains/ml-engine/**'
      - 'libs/**'
      - '.github/workflows/ci-ml.yml'
      - '.github/workflows/reusable-group-ci.yml'
  pull_request:
    paths:
      - 'domains/ml-engine/**'
      - 'libs/**'
      - '.github/workflows/ci-ml.yml'
      - '.github/workflows/reusable-group-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-ml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/reusable-group-ci.yml
    with:
      group_name: ml
      domain_dir: ml-engine
      services: '["openvino-service","ml-service","device-intelligence-service","rag-service","model-prep"]'
