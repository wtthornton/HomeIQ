name: Docker Security Scan

on:
  pull_request:
    paths:
      - '**/Dockerfile*'
      - '.github/workflows/docker-security-scan.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

# Restrictive default for every job. Jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  scan-images:
    name: Security Scan Docker Images
    runs-on: ubuntu-latest
    # github/codeql-action/upload-sarif writes to the code-scanning API. Without
    # security-events:write that step fails with "Resource not accessible by
    # integration" while the Trivy scan above it passes -- which reads as a
    # vulnerability finding but is a token scope.
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        service:
          - websocket-ingestion
          - data-api
          - admin-api
          - weather-api
          - health-dashboard
          - ai-automation-service-new
          - ha-ai-agent-service
          - ai-pattern-service
          - device-intelligence-service
          - ml-service
          - openvino-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Find Dockerfile
        id: find-dockerfile
        run: |
          DOCKERFILE=$(find domains -path "*/${{ matrix.service }}/Dockerfile" -print -quit)
          if [ -n "$DOCKERFILE" ]; then
            echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Dockerfile found at $DOCKERFILE"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Dockerfile not found for ${{ matrix.service }}, skipping"
          fi

      - name: Build Docker image
        if: steps.find-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.find-dockerfile.outputs.dockerfile }}
          push: false
          tags: homeiq-${{ matrix.service }}:scan
          load: true

      - name: Run Trivy vulnerability scanner
        if: steps.find-dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: homeiq-${{ matrix.service }}:scan
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        if: steps.find-dockerfile.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'

  scan-all:
    name: Security Scan All Services
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Report Docker Compose version
        run: docker compose version

      - name: Materialize CI placeholder env
        # docker-compose.yml's `include:` entries each declare `env_file: .env`
        # literally (not `${...}`-interpolated), so the top-level `--env-file`
        # CLI flag does not reach them -- verified locally: `docker compose
        # --env-file .env.ci config` still failed with ".env: no such file"
        # even though .env.ci carries every `:?required` value. Copying the
        # committed, non-secret .env.ci placeholders to .env satisfies that
        # literal reference so interpolation can resolve. Building images
        # never needs real credentials -- only Compose's config-resolution
        # step does.
        run: cp .env.ci .env

      - name: Build all services
        run: |
          docker compose --env-file .env.ci build --parallel

      - name: Scan all images with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: 'docker-compose.yml'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
