name: Docker Security Scan

on:
  pull_request:
    paths:
      - '**/Dockerfile*'
      - '.github/workflows/docker-security-scan.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

# Restrictive default for every job. Jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  scan-images:
    name: Security Scan Docker Images
    runs-on: ubuntu-latest
    # github/codeql-action/upload-sarif writes to the code-scanning API. Without
    # security-events:write that step fails with "Resource not accessible by
    # integration" while the Trivy scan above it passes -- which reads as a
    # vulnerability finding but is a token scope.
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        service:
          - websocket-ingestion
          - data-api
          - admin-api
          - weather-api
          - health-dashboard
          - ai-automation-service-new
          - ha-ai-agent-service
          - ai-pattern-service
          - device-intelligence-service
          - ml-service
          - openvino-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Find Dockerfile
        id: find-dockerfile
        run: |
          DOCKERFILE=$(find domains -path "*/${{ matrix.service }}/Dockerfile" -print -quit)
          if [ -n "$DOCKERFILE" ]; then
            echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Dockerfile found at $DOCKERFILE"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Dockerfile not found for ${{ matrix.service }}, skipping"
          fi

      - name: Build Docker image
        if: steps.find-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.find-dockerfile.outputs.dockerfile }}
          push: false
          tags: homeiq-${{ matrix.service }}:scan
          load: true

      - name: Run Trivy vulnerability scanner
        if: steps.find-dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: homeiq-${{ matrix.service }}:scan
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        if: steps.find-dockerfile.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'

  scan-all:
    name: Security Scan All Services
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Report Docker Compose version
        run: docker compose version

      - name: Materialize CI placeholder env
        # docker-compose.yml's `include:` entries each declare `env_file: .env`
        # literally (not `${...}`-interpolated), so the top-level `--env-file`
        # CLI flag does not reach them -- verified locally: `docker compose
        # --env-file .env.ci config` still failed with ".env: no such file"
        # even though .env.ci carries every `:?required` value. Copying the
        # committed, non-secret .env.ci placeholders to .env satisfies that
        # literal reference so interpolation can resolve. Building images
        # never needs real credentials -- only Compose's config-resolution
        # step does.
        run: cp .env.ci .env

      - name: Derive first-party image set
        # A service is first-party iff its compose entry has a `build:` key --
        # that is the only thing this repo controls the Dockerfile/base-image
        # for. Anything with only an `image:` key is pulled from a registry we
        # don't build (influxdb, pgvector, ...); those go to the separate
        # scan-third-party job below, not into this gate. Service names come
        # from the compose config itself (not a hand-maintained list) so a new
        # service is classified correctly the moment it's added. `config
        # --format json`'s `.services[].image` is null for any service that
        # doesn't set `image:` explicitly in the YAML -- it is NOT the
        # resolved build tag -- so the actual tags are looked up via `config
        # --images <service...>` (which does resolve compose's default
        # `<project>-<service>` naming), passing just the first-party service
        # names as filters.
        run: |
          set -euo pipefail
          mapfile -t SERVICES < <(docker compose --env-file .env.ci config --format json | jq -r '.services | to_entries[] | select(.value.build != null) | .key' | sort -u)
          echo "Derived ${#SERVICES[@]} first-party services (have a build: key)"
          mapfile -t IMAGES < <(docker compose --env-file .env.ci config --images "${SERVICES[@]}" | sort -u)
          echo "Resolved ${#IMAGES[@]} first-party images"
          printf '%s\n' "${IMAGES[@]}" | tee /tmp/first-party-images.txt

      - name: Build all services
        run: |
          docker compose --env-file .env.ci build --parallel

      - name: Set up Trivy CLI
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Scan first-party images with Trivy
        # The previous single trivy-action step passed scan-type: 'image' with
        # scan-ref: 'docker-compose.yml' -- a filename, not an image reference,
        # so Trivy tried to pull an image literally named "docker-compose.yml"
        # ("unable to find the specified image"). trivy-action's image-ref also
        # only ever accepts one image per step, which could never have covered
        # all services anyway. Loop the real Trivy CLI over the first-party set
        # derived above instead. This is the merge/schedule gate: it must stay
        # red on a real first-party CVE, so --exit-code stays 1 and this job is
        # not continue-on-error.
        run: |
          set -euo pipefail
          mapfile -t IMAGES < /tmp/first-party-images.txt
          echo "Scanning ${#IMAGES[@]} first-party images"
          status=0
          for img in "${IMAGES[@]}"; do
            echo "::group::trivy image ${img}"
            trivy image --exit-code 1 --severity CRITICAL,HIGH --ignorefile "${GITHUB_WORKSPACE}/.trivyignore" --format table "${img}" || status=1
            echo "::endgroup::"
          done
          exit "${status}"

  scan-third-party:
    name: Security Scan Third-Party Images (report only)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Reporting job, not a merge gate (TAP-7250, 2026-09-09): influxdb and
    # pgvector are pulled images we don't build, so a Dockerfile fix can't
    # clear their Go-module CVEs -- see .trivyignore and the PR's
    # needs-decision section. continue-on-error is set at the JOB level (the
    # honest shape for a non-blocking report) so this job's own conclusion
    # stays truthful -- it still runs the unchanged --exit-code 1 trivy
    # command and fails when CVEs are present -- while not blocking the
    # workflow or being in any required-checks list. The gate that PRs and
    # branch protection must watch is `Security Scan All Services` above.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Materialize CI placeholder env
        # See the identical step in scan-all: docker-compose.yml's `include:`
        # entries reference `.env` literally, so this placeholder copy is
        # needed purely to resolve `docker compose config`, not for real
        # credentials.
        run: cp .env.ci .env

      - name: Derive third-party image set
        # Same derivation as scan-all's first-party step, inverted: a service
        # with only an `image:` key (no `build:`) is third-party. See that
        # step for why the actual tag is resolved via `config --images
        # <service...>` rather than read off `.services[].image` in the JSON.
        run: |
          set -euo pipefail
          mapfile -t SERVICES < <(docker compose --env-file .env.ci config --format json | jq -r '.services | to_entries[] | select(.value.build == null) | .key' | sort -u)
          echo "Derived ${#SERVICES[@]} third-party services (image: only, no build: key)"
          mapfile -t IMAGES < <(docker compose --env-file .env.ci config --images "${SERVICES[@]}" | sort -u)
          echo "Resolved ${#IMAGES[@]} third-party images"
          printf '%s\n' "${IMAGES[@]}" | tee /tmp/third-party-images.txt

      - name: Set up Trivy CLI
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Scan third-party images with Trivy
        # Unchanged trivy command/flags from the first-party gate -- only the
        # image set differs. These images are pulled straight from the
        # registry (never built), so no docker compose build step precedes
        # this.
        run: |
          set -euo pipefail
          mapfile -t IMAGES < /tmp/third-party-images.txt
          echo "Scanning ${#IMAGES[@]} third-party images"
          status=0
          for img in "${IMAGES[@]}"; do
            echo "::group::trivy image ${img}"
            trivy image --exit-code 1 --severity CRITICAL,HIGH --ignorefile "${GITHUB_WORKSPACE}/.trivyignore" --format table "${img}" || status=1
            echo "::endgroup::"
          done
          exit "${status}"
