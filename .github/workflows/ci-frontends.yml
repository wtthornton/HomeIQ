name: "CI — Frontends"

on:
  push:
    branches: [master, main]
    paths:
      - 'domains/frontends/**'
      - 'libs/**'
      - '.github/workflows/ci-frontends.yml'
      - '.github/workflows/reusable-group-ci.yml'
  pull_request:
    paths:
      - 'domains/frontends/**'
      - 'libs/**'
      - '.github/workflows/ci-frontends.yml'
      - '.github/workflows/reusable-group-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-frontends-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/reusable-group-ci.yml
    with:
      group_name: frontends
      domain_dir: frontends
      # TAP-7275: ai-automation-ui retired; its front door is the Home Assistant
      # integration (custom_components/homeiq).
      services: '["observability-dashboard"]'
