name: "CI — Automation Core"

on:
  push:
    branches: [master, main]
    paths:
      - 'domains/automation-core/**'
      - 'libs/**'
      - '.github/workflows/ci-automation.yml'
      - '.github/workflows/reusable-group-ci.yml'
  pull_request:
    paths:
      - 'domains/automation-core/**'
      - 'libs/**'
      - '.github/workflows/ci-automation.yml'
      - '.github/workflows/reusable-group-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-automation-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/reusable-group-ci.yml
    with:
      group_name: automation-core
      domain_dir: automation-core
      services: '["ha-ai-agent-service","ai-automation-service-new","automation-linter","yaml-validation-service","automation-trace-service"]'
