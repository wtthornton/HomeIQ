name: E2E & Integration Tests

# NOTE: Per-service unit tests are now handled by domain-scoped CI workflows
# (ci-core.yml, ci-automation.yml, ci-ml.yml, etc.) via reusable-group-ci.yml.
# This workflow focuses on cross-service E2E and integration tests only.
# The monolithic python-tests matrix was removed on 2026-02-25 (CI/CD Phase 3, step 3.7).

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch: {}

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Job 1: End-to-End Tests (Playwright)
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    env:
      # Single definition of the compose scope so up / ps / logs / down can
      # never drift onto different project names, files, or env files.
      #
      # Targets the one domain file rather than the root orchestrator, because
      # the root file's `include:` merges all nine domains and those disagree
      # about `homeiq_logs`: core-platform declares it as a managed volume
      # while data-collectors and device-management declare the same name
      # `external: true`. Compose rejects that with "volumes.homeiq_logs
      # conflicts with imported resource". All seven services this job needs
      # live in core-platform, so the merge buys nothing here.
      #
      # `--env-file` is explicit because the implicit `.env` is read from the
      # project directory, which for `-f domains/core-platform/compose.yml` is
      # that file's directory, not the repo root. The `env_file: ../../.env`
      # entries inside the compose file resolve relative to the file and so
      # still land on the repo root — do not add `--project-directory`, which
      # would repoint those at the parent of the repo.
      COMPOSE: "-p homeiq-e2e --env-file .env -f domains/core-platform/compose.yml"
      # ha-simulator sits behind the `development` profile, so it is never
      # started by a plain `up`; naming it explicitly enables that profile.
      # websocket-ingestion needs it: StandardHealthCheck answers /health with
      # 503 while a registered dependency check is failing, so without a Home
      # Assistant to reach, the container never reports healthy.
      E2E_SERVICES: "influxdb postgres ha-simulator data-api websocket-ingestion admin-api health-dashboard"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Check if e2e tests exist
        id: check-e2e
        run: |
          if [ -d "tests/e2e" ] && [ -f "tests/e2e/package.json" ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "E2E tests found"
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "No E2E tests found - skipping"
          fi

      - name: Set up Docker Buildx
        if: steps.check-e2e.outputs.has_tests == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Start core-platform stack
        if: steps.check-e2e.outputs.has_tests == 'true'
        run: |
          # Scoped to the seven services the Playwright specs actually reach.
          # A bare `docker compose up -d` on the root file starts 45 services,
          # 38 of them built from source, which no hosted runner finishes in
          # time — this job was 0-for-40 before that was addressed.
          #
          # Driven from the canonical compose files rather than a hand-rolled
          # CI-only copy, so service definitions keep a single source of truth.
          #
          # All seven `:?required` names across the included domain files must
          # be set even though only some belong to the seven services above:
          # compose interpolates the whole merged model before it selects
          # services, so a value missing anywhere aborts the run.
          cat > .env << 'EOF'
          # CI test values — non-secret, this stack is torn down with the runner.
          INFLUXDB_PASSWORD=test_password_ci
          INFLUXDB_TOKEN=test_token
          POSTGRES_PASSWORD=homeiq_test
          ADMIN_API_JWT_SECRET=test_jwt_secret_ci
          ADMIN_PASSWORD=test_admin_password_ci
          HOMEIQ_MCP_READ_TOKENS=test_read_token_ci
          GF_SECURITY_ADMIN_PASSWORD=test_grafana_password_ci
          INFLUXDB_ORG=homeiq
          INFLUXDB_BUCKET=home_assistant_events
          OPENAI_API_KEY=sk-test-key
          HA_HTTP_URL=http://ha-simulator:8123
          HA_WS_URL=ws://ha-simulator:8123/api/websocket
          HA_TOKEN=test_token
          # data-api's Settings validator refuses to construct without one of
          # DATA_API_API_KEY / DATA_API_KEY / API_KEY, so an unset value is a
          # startup crash rather than an anonymous-access fallback.
          API_KEY=test_api_key_ci
          DATA_API_API_KEY=test_api_key_ci
          EOF

          # core-platform declares homeiq-network `external: true`, so compose
          # will not create it — that is scripts/ensure-network.sh's job on a
          # developer machine, and nothing had run it on a runner.
          sh scripts/ensure-network.sh

          docker compose $COMPOSE up -d --build $E2E_SERVICES

      - name: Wait for services to be healthy
        if: steps.check-e2e.outputs.has_tests == 'true'
        run: |
          # The health chain is serial — influxdb+postgres, then data-api, then
          # admin-api, then health-dashboard — and each leg carries a 30-40s
          # start_period, so the old 180s ceiling could expire while the stack
          # was still coming up correctly.
          MAX_WAIT=600
          ELAPSED=0
          INTERVAL=10

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(docker compose $COMPOSE ps --format json 2>/dev/null || echo "")
            TOTAL=$(echo "$STATUS" | jq -s -r 'flatten | length')
            HEALTHY=$(echo "$STATUS" | jq -s -r '[flatten[] | select(.Health == "healthy")] | length')

            # Previously this accepted `HEALTHY -gt 0`, so one healthy container
            # was enough to declare the whole stack ready and let Playwright run
            # against services that were not up. Require all of them.
            if [ "$TOTAL" -gt 0 ] && [ "$HEALTHY" -eq "$TOTAL" ]; then
              echo "All $TOTAL services healthy after ${ELAPSED}s"
              docker compose $COMPOSE ps
              exit 0
            fi

            echo "Healthy $HEALTHY/$TOTAL (${ELAPSED}s/${MAX_WAIT}s)..."
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Timeout waiting for services to become healthy"
          docker compose $COMPOSE ps
          docker compose $COMPOSE logs --tail=50
          exit 1

      - name: Install Playwright dependencies
        if: steps.check-e2e.outputs.has_tests == 'true'
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests (Health Dashboard)
        if: steps.check-e2e.outputs.has_tests == 'true'
        working-directory: tests/e2e
        env:
          TEST_BASE_URL: http://localhost:3000
          # A CLI --reporter overrides the config's reporter array, so the
          # outputFile set in health-dashboard/playwright.config.ts does not
          # apply and the json reporter would otherwise go to stdout.
          #
          # Absolute: a relative value here resolves against the config's
          # rootDir (tests/e2e/health-dashboard), not the working directory,
          # which is what left the pass-rate check reporting "No JSON results
          # found" even after it was pointed at the right filename.
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/e2e-results.json
        run: |
          # Only the health-dashboard suite runs here. The ai-automation-ui
          # suite targets :3001 and the full-suite run reaches services this
          # scoped stack does not start; both are covered by the follow-up in
          # the workflow README rather than left failing.
          npx playwright test health-dashboard --config health-dashboard/playwright.config.ts --project=chromium --grep "@smoke" --reporter=list,json

      - name: E2E pass-rate check (Epic 89.5)
        if: always() && steps.check-e2e.outputs.has_tests == 'true'
        working-directory: tests/e2e
        run: |
          RESULTS="${{ github.workspace }}/e2e-results.json"
          if [ -f "$RESULTS" ]; then
            # `expected` is the count that passed, not the total. Using it as
            # the denominator made the rate self-referential: 10 passed and 5
            # failed reported 50% rather than 67%. Total is the sum of the
            # outcome buckets, and skipped tests are excluded from the rate.
            PASSED=$(jq ".stats.expected // 0" "$RESULTS")
            FAILED=$(jq ".stats.unexpected // 0" "$RESULTS")
            FLAKY=$(jq ".stats.flaky // 0" "$RESULTS")
            SKIPPED=$(jq ".stats.skipped // 0" "$RESULTS")
            TOTAL=$(( PASSED + FAILED + FLAKY ))
            if [ "$TOTAL" -gt 0 ]; then
              PASS_RATE=$(( PASSED * 100 / TOTAL ))
              echo "### E2E Pass Rate: ${PASS_RATE}%" >> $GITHUB_STEP_SUMMARY
              echo "- Passed: $PASSED | Failed: $FAILED | Skipped: $SKIPPED" >> $GITHUB_STEP_SUMMARY
              if [ "$PASS_RATE" -lt 95 ]; then
                echo "::warning::E2E pass rate ${PASS_RATE}% is below 95% threshold"
              fi
            fi
          else
            echo "No JSON results found — skipping pass-rate check"
          fi

      - name: Upload Playwright report
        if: always() && steps.check-e2e.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e-results.json
            test-results/
          retention-days: 7

      - name: Show service logs on failure
        if: failure() && steps.check-e2e.outputs.has_tests == 'true'
        run: |
          echo "Service Logs:"
          docker compose $COMPOSE logs --tail=100

      - name: Stop Docker services
        if: always() && steps.check-e2e.outputs.has_tests == 'true'
        run: |
          docker compose $COMPOSE down -v

  # Job 2: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Check if integration tests exist
        id: check-integration
        run: |
          if [ -d "tests/integration" ] && [ -n "$(find tests/integration -name 'test_*.py' 2>/dev/null)" ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "Integration tests found"
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "No integration tests found - skipping"
          fi

      - name: Install dependencies
        if: steps.check-integration.outputs.has_tests == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-timeout httpx aiohttp

          # One invocation, and no `|| true`. The suppression here was hiding a
          # real failure: homeiq-data and homeiq-memory depend on siblings that
          # are not on PyPI, so installing one at a time silently dropped both,
          # and the missing transitive deps resurfaced later as
          # "ModuleNotFoundError: No module named 'sqlalchemy'".
          pip install libs/homeiq-*/

      - name: Run integration tests
        if: steps.check-integration.outputs.has_tests == 'true'
        run: |
          pytest tests/integration/ \
            --verbose \
            --timeout=300 \
            -m "integration"

  # Job 3: Test Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-tests, integration-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Per-service unit tests run in domain-scoped CI workflows." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "**E2E Tests:** Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.e2e-tests.result }}" == "skipped" ]; then
            echo "**E2E Tests:** Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "**E2E Tests:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "**Integration Tests:** Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.integration-tests.result }}" == "skipped" ]; then
            echo "**Integration Tests:** Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Integration Tests:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

          # Propagate the result. Writing "Failed" into the step summary and then
          # exiting 0 made this job report success while both jobs it summarizes
          # were red. `skipped` is a legitimate outcome; anything that is neither
          # success nor skipped is not.
          rc=0
          for job in "e2e-tests:${{ needs.e2e-tests.result }}" \
                     "integration-tests:${{ needs.integration-tests.result }}"; do
            name="${job%%:*}"
            result="${job#*:}"
            case "$result" in
              success|skipped) ;;
              *) echo "::error::$name concluded '$result'"; rc=1 ;;
            esac
          done
          exit "$rc"
